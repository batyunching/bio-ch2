  const rows=[['班級','座號','姓名','連線數','糖果數','答題紀錄']].concat(ps.map(p=>[p.cls,p.seat,p.name,p.lines||0,p.lines||0,log.filter(l=>l.pid===p.id).map(l=>`${l.n}號:${l.ok?'對':'錯'}`).join('；')]));
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`賓果成績_${H.code}_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ======================= 學生平板 ======================= */
const S4={};
function bingoJoin(code,demo){
  const me=store.get('bingoMe',{});
  app.innerHTML=`<section class="pbox bg-join"><h1 class="ptitle">加入賓果</h1>
    <label>房號<input id="jCode" inputmode="numeric" maxlength="4" value="${esc(code||me.code||'')}" placeholder="4 位數房號"></label>
    <label>班級<select id="jCls">${CLASSES.map(c=>`<option ${c===me.cls?'selected':''}>${c}</option>`).join('')}</select></label>
    <label>座號<select id="jSeat">${Array.from({length:40},(_,i)=>`<option ${i+1===+me.seat?'selected':''}>${i+1}</option>`).join('')}</select></label>
    <label>姓名<input id="jName" maxlength="8" value="${esc(me.name||'')}" placeholder="你的名字"></label>
    ${demo||!FIREBASE_CONFIG?'<p class="bg-warn">單機示範模式</p>':''}
    <button class="pbtn gold" id="jGo">加入</button><p class="bg-note" id="jMsg"></p></section>`;
  const msg=t=>document.getElementById('jMsg').textContent=t;
  document.getElementById('jGo').onclick=async()=>{SFX.tap();BAU.unlock();
    const c=document.getElementById('jCode').value.trim(),cls=document.getElementById('jCls').value,seat=+document.getElementById('jSeat').value,name=document.getElementById('jName').value.trim();
    if(!/^\d{4}$/.test(c)){msg('請輸入 4 位數房號');return}if(!name){msg('請輸入姓名');return}
    msg('連線中……');try{await DB.init(demo||!FIREBASE_CONFIG)}catch(e){msg('無法連線：'+e.message);return}
    const info=await DB.get(`bingo/rooms/${c}/info`);if(!info){msg('找不到這個房號，請再確認一次');return}
    const pid=`${cls}-${seat}`,R=`bingo/rooms/${c}`,old=await DB.get(`${R}/players/${pid}`);
    if(old&&old.name!==name&&document.getElementById('jGo').dataset.force!=='1'){msg(`這個座號已經有人使用（${old.name}）。如果是你本人換名字，再按一次「加入」。`);document.getElementById('jGo').dataset.force='1';return}
    const all=await DB.get(`${R}/players`)||{};const dup=Object.entries(all).find(([id,p])=>id!==pid&&p.name===name&&p.cls===cls);
    if(dup&&document.getElementById('jGo').dataset.dup!=='1'){msg(`班上已經有同名的同學（座號 ${dup[1].seat}），確定沒錯的話再按一次「加入」。`);document.getElementById('jGo').dataset.dup='1';return}
    if(old)await DB.update(`${R}/players/${pid}`,{name,online:true});
    else await DB.set(`${R}/players/${pid}`,{cls,seat,name,joined:DB.ts(),card:shuffle(Array.from({length:25},(_,i)=>i+1)),lines:0,online:true});
    DB.onDisconnect(`${R}/players/${pid}/online`,false);
    store.set('bingoMe',{code:c,cls,seat,name});studentRoom(c,pid)};
}
function studentRoom(code,pid){
  bgClear();Object.assign(S4,{code,pid,R:`bingo/rooms/${code}`,room:{},lines:0,shown:{}});
  app.innerHTML=`<div class="bg-stu"><section class="pbox bg-sbar"><span class="px">房號 ${code}</span><b class="bg-me"></b><span class="sp"></span><span class="bg-mine"></span></section>
    <section class="pbox bg-turnbox"></section><section class="pbox bg-cardbox"><div class="bg-card"></div><p class="bg-note">開出的號碼會發亮，點一下畫 X；連成一條線就能拿一顆糖果！</p></section></div>`;
  BG.unsub.push(DB.on(S4.R,v=>{S4.room=v||{};studentRender()}));
  BG.timer=setInterval(()=>{const t=S4.room.turn;const el=document.querySelector('.bg-stimer');if(t&&t.state==='question'&&el){const left=Math.max(0,Math.ceil((t.deadline-DB.now())/1000));el.textContent=left;el.classList.toggle('hurry',left<=5)}},250);
}
function studentRender(){
  const r=S4.room,me=(r.players||{})[S4.pid];if(!me)return;
  const st=r.info||{},t=r.turn||{},opened=r.opened||{},marks=me.marks||{};
  if(st.autoX)Object.keys(opened).forEach(n=>{if(!marks[n]){marks[n]=true;DB.set(`${S4.R}/players/${S4.pid}/marks/${n}`,true)}});
  document.querySelector('.bg-me').textContent=`${me.cls}-${me.seat} ${me.name}`;
  const L=linesOf(me.card,marks);document.querySelector('.bg-mine').innerHTML=`連線 <b>${L}</b>　${'🍬'.repeat(L)}`;
  const box=document.querySelector('.bg-turnbox'),q=t.qid?qById(t.qid):null,mine=t.pid===S4.pid;
  if(st.status==='lobby')box.innerHTML=`<div class="bg-turn">已加入！等待老師開始遊戲……</div>`;
  else if(st.status==='ended')box.innerHTML=`<div class="px bg-big">GAME OVER</div><p>你完成了 <b>${L}</b> 條線，獲得 ${L} 顆糖果！</p>`;
  else if(t.state==='wait')box.innerHTML=mine?`<div class="bg-turn">輪到你抽球了！</div><button class="pbtn gold bg-draw" id="sDraw">🎱 抽球</button>`:`<div class="bg-turn">輪到 <b>${esc(t.name)}</b> 抽球</div>`;
  else if(t.state==='spin')box.innerHTML=`<div class="bg-turn">搖獎機轉動中……</div>`;
  else if(t.state==='question'&&q){
    if(box.dataset.seq!==String(t.seq)||box.dataset.mode!=='q'){box.dataset.seq=t.seq;box.dataset.mode='q';
      box.innerHTML=`<div class="bg-qhead"><div class="bg-ball">${t.n}</div><div class="bg-turn small">${mine?'<b>你</b>作答中':`<b>${esc(t.name)}</b> 作答中`}</div><div class="bg-stimer px"></div></div>${bQ(q)}
        <div class="bg-opts stu">${q.options.map((o,i)=>`<button class="q-opt" data-i="${i}" ${mine?'':'disabled'}><span class="q-l">${q.type==='tf'?(i?'✕':'○'):'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`;
      if(mine)box.querySelectorAll('.q-opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.q-opt').forEach(x=>x.disabled=true);b.classList.add('pick');DB.set(`${S4.R}/ans`,{seq:t.seq,pid:S4.pid,choice:+b.dataset.i});SFX.tap()})}}
  else if(t.state==='result'&&q){if(box.dataset.mode!=='r'+t.seq){box.dataset.mode='r'+t.seq;
      box.innerHTML=`<div class="bg-qhead"><div class="bg-ball">${t.n}</div><div class="bg-res ${t.ok?'ok':'no'} px">${t.ok?'答對了！':t.choice<0?'時間到！':'答錯了'}</div></div><div class="bg-exp">正確答案：${esc(q.options[q.answer])}<br>${esc(q.explain)}</div>
        <div class="bg-after">${t.ok?`${t.n} 號開出，快把它畫 X！`:'號碼球放回，換下一位同學'}</div>`;if(mine)t.ok?BAU.ok():BAU.bad()}}
  else box.innerHTML=`<div class="bg-turn">準備中……</div>`;
  const sd=document.getElementById('sDraw');if(sd)sd.onclick=()=>{sd.disabled=true;BAU.unlock();DB.set(`${S4.R}/drawReq`,{seq:t.seq,pid:S4.pid});SFX.tap()};
  // 賓果卡
  const lit=lineIdx(me.card,marks).flatMap(i=>BL[i]);
  document.querySelector('.bg-card').innerHTML=me.card.map((n,i)=>`<button class="cell ${opened[n]?'open':''} ${marks[n]?'x':''} ${lit.includes(i)?'line':''}" data-n="${n}">${n}${marks[n]?'<span class="xx">✕</span>':''}</button>`).join('');
  document.querySelectorAll('.bg-card .cell').forEach(c=>c.onclick=()=>{const n=+c.dataset.n;if(marks[n])return;if(!opened[n]){toast('這個號碼還沒開出喔');SFX.lock&&SFX.lock();return}
    SFX.coin();DB.set(`${S4.R}/players/${S4.pid}/marks/${n}`,true)});
  // 連線檢查
  const prevL=Math.max(me.lines||0,S4.reported||0);
  if(L>prevL){S4.reported=L;const up={lines:L};if(!me.firstLine)up.firstLine=DB.ts();DB.update(`${S4.R}/players/${S4.pid}`,up);
    DB.push(`${S4.R}/events`,{type:'line',pid:S4.pid,name:me.name,cls:me.cls,lines:L,gain:L-prevL,ts:DB.ts()});
    fireworks(false,4000);BAU.cheer();if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);toast(`BINGO！完成第 ${L} 條線 🍬`)}
}
SCENES.bingo=()=>bands(['#1a1036','#221446','#2b1a56','#352066','#3f2676','#4a2c86'])+
  Array.from({length:40},(_,i)=>`<rect x="${(i*53)%320}" y="${(i*37)%120}" width="${i%3?2:3}" height="${i%3?2:3}" fill="#fff" opacity="${.4+(i%5)*.12}"/>`).join('')+
  `<g class="drift">${spr(SP.coin,40,30,3)}</g><g class="drift2">${spr(SP.coin,200,50,2)}</g>`+
  `<rect x="0" y="150" width="320" height="30" fill="#2a1a12"/>`+Array.from({length:20},(_,i)=>`<rect x="${i*16}" y="150" width="15" height="6" fill="${['#ff5f8f','#ffd23f','#5cbf3a','#5aa9e6'][i%4]}"/>`).join('');
