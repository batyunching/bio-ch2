<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生物體的營養大冒險｜第2章互動學習</title>
<meta name="description" content="國中自然第2章 生物體的營養：2-2 酵素、2-3 植物如何製造養分、2-4 人體如何獲得養分 互動學習網站">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== 中文像素字型（俐方體11號，SIL OFL）；載入失敗會自動改用一般黑體 ===== */
@font-face{
  font-family:"Cubic11";
  src:url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/web/Cubic_11.woff2") format("woff2"),
      url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/Cubic_11.woff2") format("woff2"),
      url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/ttf/Cubic_11.ttf") format("truetype"),
      url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/Cubic_11.ttf") format("truetype");
  font-display:swap;
}
:root{
  --ink:#2a1a12; --ink2:#5a3b28; --paper:#fff8e6; --paper2:#ffefc7;
  --gold:#e0a91f; --gold-d:#9c6f08; --gold-l:#ffd65a;
  --u22:#f07f24; --u22d:#a4480f; --u22l:#ffd2a6;
  --u23:#3f9f45; --u23d:#1f5f27; --u23l:#c9eda0;
  --u24:#e45f84; --u24d:#9a2648; --u24l:#ffd0dc;
  --accent:var(--gold); --accent-d:var(--gold-d); --accent-l:var(--gold-l);
  --dlg:#1c2350; --ok:#2f9e44; --no:#d6336c;
  --px:"Cubic11","Press Start 2P","Noto Sans TC","Microsoft JhengHei",monospace;
  --tx:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
body[data-theme="2-2"]{--accent:var(--u22);--accent-d:var(--u22d);--accent-l:var(--u22l)}
body[data-theme="2-3"]{--accent:var(--u23);--accent-d:var(--u23d);--accent-l:var(--u23l)}
body[data-theme="2-4"]{--accent:var(--u24);--accent-d:var(--u24d);--accent-l:var(--u24l)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--tx);font-size:18px;line-height:1.6;color:var(--ink);background:#7ec8f0;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
.px{font-family:var(--px);letter-spacing:.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 背景場景 ===== */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
.drift{animation:drift 70s linear infinite}
.drift2{animation:drift 110s linear infinite}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(360px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s steps(8) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}15%{opacity:.9}to{transform:translateY(-200px);opacity:0}}
.belt{animation:belt 1.2s steps(4) infinite}
@keyframes belt{to{transform:translateX(16px)}}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.puff{animation:puff 3s steps(6) infinite;transform-box:fill-box}
@keyframes puff{from{transform:translateY(0);opacity:.9}to{transform:translateY(-30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.drift,.drift2,.spin,.rise,.belt,.bob,.puff{animation:none}}

/* ===== HUD ===== */
#hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--ink);color:#fff;border-bottom:4px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#hud .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0}
#hud .logo b{font-family:var(--px);font-size:13px;color:var(--gold-l);white-space:nowrap}
#hud .logo span{font-family:var(--px);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .sp{flex:1}
.coinbox{display:flex;align-items:center;gap:6px;font-family:var(--px);font-size:15px;color:var(--gold-l);white-space:nowrap}
.hbtn{min-width:48px;min-height:48px;padding:6px 12px;border:3px solid #000;background:#3b2a20;color:#fff;cursor:pointer;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.15);font-family:var(--px);font-size:14px;white-space:nowrap}
.hbtn:active{transform:translateY(2px)}
.modesw{display:flex;border:3px solid #000}
.modesw button{min-height:44px;padding:4px 12px;border:0;background:#3b2a20;color:#cbb;cursor:pointer;font-family:var(--px);font-size:14px}
.modesw button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
@media (max-width:640px){#hud{gap:6px;padding:6px 8px;flex-wrap:wrap;position:relative}#hud .logo span{font-size:13px}.modesw button{padding:4px 8px;font-size:13px}.hbtn{padding:4px 8px}}

/* ===== 共用像素元件 ===== */
main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:22px 16px 140px}
.pbox{background:var(--paper);border:4px solid var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),inset 0 4px 0 #fff,6px 6px 0 rgba(42,26,18,.85)}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;min-width:52px;padding:8px 18px;cursor:pointer;
  background:var(--accent);color:#fff;border:4px solid var(--ink);font-family:var(--px);font-size:16px;text-decoration:none;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.35),0 5px 0 var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.35);transition:transform .05s}
.pbtn:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.35),0 1px 0 var(--ink)}
.pbtn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.pbtn.gold{background:var(--gold)}
.pbtn[disabled]{opacity:.45;cursor:not-allowed}
.ptitle{font-family:var(--px);font-weight:400;margin:0;line-height:1.3;text-shadow:3px 3px 0 rgba(0,0,0,.25)}
svg.ill{width:100%;height:auto;display:block;background:#fffdf5}
.svt{font-family:var(--tx);paint-order:stroke;stroke:#fffdf5;stroke-width:2.6px;stroke-linejoin:round}

/* ===== 首頁 ===== */
.title-screen{text-align:center;padding:26px 18px 22px;margin:8px auto 28px;max-width:900px}
.title-screen .world{font-family:"Press Start 2P",var(--px);font-size:14px;color:var(--gold-d);letter-spacing:.15em}
.title-screen h1{font-size:clamp(30px,5.6vw,58px);color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:10px 0 6px}
.title-screen p{margin:6px 0 0;font-size:18px}
.squad{display:flex;justify-content:center;gap:18px;margin-top:14px}
.squad svg{width:64px;height:64px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.map{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;align-items:end}
.map::before{content:"";position:absolute;left:8%;right:8%;top:58%;border-top:8px dashed rgba(42,26,18,.55);z-index:0}
.portal{position:relative;z-index:1;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);cursor:pointer;transition:transform .1s}
.portal:nth-child(even){margin-bottom:46px}
.portal:hover:not(.locked){transform:translateY(-6px)}
.portal .plate{padding:0;overflow:hidden}
.portal .thumb{display:block;width:100%;height:auto;border-bottom:4px solid var(--ink)}
.portal .info{padding:10px 12px 12px}
.portal .num{font-family:"Press Start 2P",var(--px);font-size:13px;color:#fff;background:var(--c,var(--gold));display:inline-block;padding:4px 8px;border:3px solid var(--ink)}
.portal h2{font-family:var(--px);font-size:20px;font-weight:400;margin:8px 0 4px;line-height:1.3}
.portal .sub{font-size:15px;color:var(--ink2)}
.meter{height:16px;border:3px solid var(--ink);background:#fff;margin-top:8px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--gold-l) 8px 12px)}
.portal.locked{cursor:default;filter:saturate(.35)}
.portal.locked .lock{position:absolute;top:10px;right:10px;font-family:var(--px);font-size:13px;background:var(--ink);color:#fff;padding:3px 8px}
.howto{margin-top:34px;padding:18px 22px}
.howto-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.howto-grid{grid-template-columns:1fr}}
.tut h3{margin-top:0}.tut-v{position:relative;aspect-ratio:16/9;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#1a1036;overflow:hidden}
.tut-v button{all:unset;cursor:pointer;position:absolute;inset:0;display:block}
.tut-v img{width:100%;height:100%;object-fit:cover;display:block}
.tut-v .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#d6336c;color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px var(--ink),5px 5px 0 4px var(--ink);font:400 20px var(--px);padding:12px 22px;white-space:nowrap}
.tut-v button:hover .play,.tut-v button:focus-visible .play{background:#e0a91f;color:var(--ink)}
.tut-v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tut p{margin:8px 0 0;font-size:15px}
.tut-btn{display:inline-block;margin-top:12px;background:#d6336c;color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 16px;font-weight:900;text-decoration:none;cursor:pointer;font-size:16px}
.tut-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.howto h3{font-family:var(--px);font-weight:400;margin:0 0 8px;font-size:20px}
.howto ul{margin:0;padding-left:1.3em}
@media (max-width:980px){.map{grid-template-columns:repeat(2,1fr)}.portal:nth-child(even){margin-bottom:0}.map::before{display:none}}
@media (max-width:520px){.map{grid-template-columns:1fr}}

/* ===== 單元頁 ===== */
.stagebar{display:flex;gap:18px;align-items:center;padding:14px 18px;margin-bottom:16px}
.stagebar .guide{width:84px;height:84px;flex:none}
.stagebar .wtag{font-family:"Press Start 2P",var(--px);font-size:13px;color:#fff;background:var(--accent);border:3px solid var(--ink);padding:4px 8px;display:inline-block}
.stagebar h1{font-size:clamp(26px,3.6vw,40px);color:var(--accent-d);margin:6px 0 2px}
.stagebar .pg{font-size:15px;color:var(--ink2)}
.talk{position:relative;flex:1;background:#fff;border:4px solid var(--ink);padding:10px 14px;font-size:17px;min-width:200px}
.talk::before{content:"";position:absolute;left:-14px;top:22px;border:7px solid transparent;border-right-color:var(--ink)}
@media (max-width:820px){.stagebar{flex-wrap:wrap}.talk{flex-basis:100%}}
.levels{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.lv{min-height:52px;padding:6px 14px;border:4px solid var(--ink);background:var(--paper);cursor:pointer;font-family:var(--px);font-size:16px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.1),0 5px 0 var(--ink);display:flex;align-items:center;gap:8px}
.lv small{font-family:"Press Start 2P",var(--px);font-size:10px;color:var(--ink2)}
.lv[aria-selected="true"]{background:var(--accent);color:#fff}
.lv[aria-selected="true"] small{color:#fff}
.lv .lk{font-size:13px;background:var(--ink);color:#fff;padding:1px 6px}
.lv:active{transform:translateY(3px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;transition:transform .1s;position:relative}
.card:hover{transform:translateY(-5px)}
.card .top{display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:#fff;padding:6px 10px;border-bottom:4px solid var(--ink)}
.card .top .n{font-family:"Press Start 2P",var(--px);font-size:14px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.card .top .st{font-family:var(--px);font-size:13px;background:rgba(0,0,0,.25);padding:1px 8px}
.card .top .st.got{background:var(--gold);color:var(--ink)}
.card .body{padding:12px 14px 14px}
.card h3{font-family:var(--px);font-weight:400;font-size:21px;margin:0 0 4px;line-height:1.35}
.card p{margin:0;font-size:16px;color:var(--ink2)}
.card svg.ill{border-bottom:4px solid var(--ink)}
.lockpanel{padding:24px 26px}
.lockpanel h2{font-family:var(--px);font-weight:400;font-size:26px;margin:0 0 6px;color:var(--accent-d)}
.lockpanel ul{padding-left:1.3em;margin:10px 0 0}
.lockpanel li{margin:4px 0}

/* ===== 卡片檢視器 ===== */
#viewer{position:fixed;inset:0;z-index:50;display:none;background:rgba(14,10,30,.78);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px);overflow:auto;padding:16px}
#viewer.open{display:block}
.vpanel{max-width:1480px;margin:0 auto;padding:0}
.vpanel.anim{animation:popin .18s steps(3)}
@keyframes popin{from{transform:scale(.94)}to{transform:none}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.vhead{display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;padding:10px 14px;border-bottom:4px solid var(--ink)}
.vhead .n{font-family:"Press Start 2P",var(--px);font-size:14px}
.vhead h2{font-family:var(--px);font-weight:400;margin:0;font-size:clamp(22px,2.6vw,36px);flex:1;text-shadow:3px 3px 0 rgba(0,0,0,.3);line-height:1.3}
.vbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;padding:18px}
.vbody .figure{border:4px solid var(--ink);align-self:start;background:#fffdf5}
.figure .cap{font-size:14px;color:var(--ink2);padding:4px 10px;border-top:3px solid var(--ink);background:var(--paper2)}
.points{list-style:none;margin:0;padding:0}
.points li{position:relative;padding:10px 12px 10px 40px;margin:0 0 10px;background:#fff;border:3px solid var(--ink);font-size:19px}
.points li::before{content:"";position:absolute;left:12px;top:19px;width:14px;height:14px;background:var(--accent);box-shadow:0 0 0 3px var(--ink)}
.quiz{margin-top:14px;padding:12px 14px;background:var(--accent-l);border:4px dashed var(--ink)}
.quiz .qh{font-family:var(--px);font-size:18px;margin-bottom:4px}
.quiz .ans{margin-top:10px;padding:10px 12px;background:#fff;border:3px solid var(--ink);display:none}
.quiz .ans.show{display:block;animation:pop .18s steps(3)}
.vfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px 18px;border-top:4px solid var(--ink);background:var(--paper2)}
.vfoot .mid{display:flex;gap:10px;flex-wrap:wrap}
.collect.got{background:var(--gold);color:var(--ink);text-shadow:none}
@media (max-width:900px){.vbody{grid-template-columns:1fr}.points li{font-size:18px}}

/* ===== 老師模式：大字、逐點顯示、隱藏解答 ===== */
body.teacher .dialog{background:var(--dlg);color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px var(--ink);padding:18px 22px;min-height:200px}
body.teacher .points li{background:transparent;border:0;border-bottom:2px dashed rgba(255,255,255,.3);color:#fff;
  font-size:clamp(24px,2.1vw,40px);line-height:1.5;padding:12px 6px 14px 50px;margin:0}
body.teacher .points li::before{background:var(--gold-l);box-shadow:none;width:18px;height:18px;left:10px;top:clamp(24px,1.9vw,34px)}
body.teacher .points li.hide{display:none}
body.teacher .points li.now{color:var(--gold-l)}
body.teacher .quiz{font-size:clamp(22px,1.8vw,32px)}
body.teacher .quiz .qh{font-size:clamp(22px,1.8vw,32px)}
body.teacher .tnext{font-family:var(--px);color:var(--gold-l);text-align:right;font-size:22px;margin-top:6px}
body.teacher .figure .cap{font-size:18px}
body:not(.teacher) .tonly{display:none!important}
body.teacher .sonly{display:none!important}
body.teacher .card h3{font-size:24px}
body.teacher .card p{font-size:18px}
.keys{font-size:14px;color:var(--ink2)}
.keys kbd{font-family:var(--px);background:#fff;border:2px solid var(--ink);padding:0 6px;margin:0 2px}

/* 大屏 1920×1080：字級 28px 以上 */
@media (min-width:1600px){
  body{font-size:20px}
  body.teacher main{max-width:1760px}
  body.teacher .stagebar h1{font-size:48px}
  body.teacher .talk{font-size:26px}
  body.teacher .lv{font-size:22px}
  body.teacher .card h3{font-size:30px}
  body.teacher .card p{font-size:24px}
  body.teacher .grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  body.teacher .points li{font-size:40px}
  body.teacher .quiz,body.teacher .quiz .qh{font-size:30px}
}

/* ===== 進場畫面與金幣特效 ===== */
#intro{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;text-align:center;padding:20px}
#intro.show{display:flex}
#intro .w{font-family:"Press Start 2P",var(--px);font-size:clamp(22px,4vw,44px)}
#intro .nm{font-family:var(--px);font-size:clamp(28px,5vw,60px);color:var(--accent-l)}
#intro .ln{font-family:"Press Start 2P",var(--px);font-size:16px;display:flex;align-items:center;gap:14px}
#intro svg{width:96px;height:96px}
#intro .skip{font-size:15px;color:#aaa}
.coinfx{position:fixed;z-index:90;pointer-events:none;font-family:"Press Start 2P",var(--px);color:var(--gold-l);font-size:20px;text-shadow:3px 3px 0 #000;animation:coinup .9s steps(9) forwards}
@keyframes coinup{to{transform:translateY(-90px);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;background:var(--ink);color:#fff;border:4px solid #000;padding:10px 18px;font-family:var(--px);font-size:16px;box-shadow:0 0 0 4px #fff}
footer.foot{position:relative;z-index:1;text-align:center;font-size:14px;color:#fff;padding:0 16px 30px;text-shadow:1px 1px 0 #000}

/* ===== 第 2 期：動畫播放器 ===== */
.anim-pick{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.anim-box{padding:14px}
.ap{display:grid;grid-template-columns:1fr;gap:14px}
.ap.has-side{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:980px){.ap.has-side{grid-template-columns:1fr}}
.ap-stage{position:relative;border:4px solid var(--ink);background:#fffdf5;touch-action:none;user-select:none;-webkit-user-select:none}
.ap-svg{display:block;width:100%;height:auto;max-height:calc(100vh - 300px);min-height:200px}
.ap-hud{position:absolute;inset:0;pointer-events:none}
.ap-hud>*{pointer-events:auto}
.ap-tools{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
.mini{min-height:40px;padding:4px 10px;border:3px solid var(--ink);background:#fff;font-family:var(--tx);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px}
.mini.on,.mini[aria-pressed="true"]{background:var(--accent);color:#fff}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mini[disabled]{opacity:.5;cursor:not-allowed}
.mini i{display:inline-block;width:12px;height:12px;border:2px solid var(--ink)}
.ap-msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px var(--ink);padding:6px 14px;font-weight:900;font-size:17px;max-width:92%;text-align:center;pointer-events:none}
.ap-msg.ok{background:#1f6f34}.ap-msg.no{background:#b0244f}
.ap-say{margin-top:10px;background:var(--dlg);color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px var(--ink);padding:10px 16px;min-height:86px}
.ap-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.ap-no{color:var(--gold-l);font-size:14px}
.ap-st{font-size:20px;color:#fff}
.ap-tx{font-size:18px;line-height:1.6;margin-top:4px}

/* =========================================================

   ========================================================= */
const C={k:'#2a1a12',w:'#fffdf5',W:'#ffffff',o:'#f08a2c',O:'#b8561a',y:'#ffd23f',Y:'#d9a400',g:'#5cbf3a',G:'#2e7d32',l:'#b4e67a',

  e:'#c4c4c4',E:'#777777',t:'#e9c98f',v:'#8e5cc8',m:'#fff3b0',a:'#7a4a1a'};
function spr(rows,x,y,s){let o='';rows.forEach((row,j)=>{let i=0;while(i<row.length){const ch=row[i];if(ch==='.'||ch===' '){i++;continue}
  let n=1;while(row[i+n]===ch)n++;o+=`<rect x="${x+i*s}" y="${y+j*s}" width="${n*s}" height="${s}" fill="${C[ch]||ch}"/>`;i+=n}});return o}
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||9}" text-anchor="${o.a||'middle'}" fill="${o.f||C.k}" font-weight="${o.b?900:700}" class="svt" ${o.f==='#fff'?'style="stroke:#2a1a12"':''}>${t}</text>`;
const BX=(x,y,w,h,f,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" stroke="${o.st||C.k}" stroke-width="${o.sw??2}" ${o.da?`stroke-dasharray="${o.da}"`:''}/>`;
function TAG(cx,cy,t,f,o={}){const s=o.s||8.5,w=o.w||Math.max(24,[...t].length*s+10),h=s+7;
  return BX(cx-w/2,cy-h/2,w,h,f)+`<text x="${cx}" y="${cy+s*0.36}" font-size="${s}" text-anchor="middle" fill="${o.tf||C.k}" font-weight="900" style="font-family:var(--tx)">${t}</text>`}
function AR(x1,y1,x2,y2,f=C.k,w=3){const a=Math.atan2(y2-y1,x2-x1),h=7,ex=x2-Math.cos(a)*h,ey=y2-Math.sin(a)*h,
  q=[ex+Math.sin(a)*h*.75,ey-Math.cos(a)*h*.75],r=[ex-Math.sin(a)*h*.75,ey+Math.cos(a)*h*.75];
  return `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${f}" stroke-width="${w}"/><polygon points="${x2},${y2} ${q} ${r}" fill="${f}"/>`}
const CK=(x,y,s=1)=>`<path d="M${x-5*s} ${y} l${4*s} ${4*s} l${7*s} -${8*s}" stroke="${C.G}" stroke-width="${3*s}" fill="none"/>`;
const XX=(x,y,s=1)=>`<path d="M${x-5*s} ${y-5*s} l${10*s} ${10*s} M${x+5*s} ${y-5*s} l-${10*s} ${10*s}" stroke="${C.r}" stroke-width="${3*s}"/>`;
const CIR=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${C.k}" stroke-width="1.6"/>`;
function SV(inner,label,bg='#fffdf5'){return `<svg class="ill" viewBox="0 0 200 125" role="img" aria-label="${label}" shape-rendering="crispEdges"><rect width="200" height="125" fill="${bg}"/>${inner}</svg>`}
/* 分子鏈：n 顆方塊相連 */
function chain(x,y,n,f,sz=9,gap=3){let o='';for(let i=0;i<n;i++){const xx=x+i*(sz+gap);if(i)o+=`<rect x="${xx-gap}" y="${y+sz/2-1.5}" width="${gap}" height="3" fill="${C.k}"/>`;o+=BX(xx,y,sz,sz,f,{sw:1.6})}return o}
function beads(x,y,n,f,r=4.2,gap=11){let o='';for(let i=0;i<n;i++)o+=CIR(x+i*gap,y,r,f);return o}
function hexa(cx,cy,r,f){let p=[];for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}
  return `<polygon points="${p.join(' ')}" fill="${f}" stroke="${C.k}" stroke-width="1.8"/>`}

/* ---- 概念卡檢視器 ---- */
const V={u:null,i:0,step:0};
const viewer=document.getElementById('viewer');
function openViewer(u,i){V.u=u;V.i=i;V.step=1;V.anim=1;SFX.open();viewer.classList.add('open');document.body.style.overflow='hidden';drawViewer();viewer.focus()}
function closeViewer(){viewer.classList.remove('open');document.body.style.overflow='';const r=parseRoute();if(r.u&&r.tab==='concept')renderUnit(r.u,r.tab)}
function drawViewer(){
  const U=UNITS[V.u],c=U.cards[V.i],n=U.cards.length,teach=mode==='teacher',total=c.pts.length;
  if(teach)V.step=Math.max(1,Math.min(V.step,total));
  const done=!teach||V.step>=total;
  viewer.innerHTML=`<div class="pbox vpanel ${V.anim?'anim':''}">
    <div class="vhead"><span class="n">${V.i+1}/${n}</span><h2>${esc(c.t)}</h2><button class="pbtn ghost" id="vClose" aria-label="關閉">✕</button></div>
    <div class="vbody">
      <div class="figure">${c.svg()}<div class="cap">${esc(c.cap)}｜課本 ${c.pg}</div></div>
      <div>
        <div class="dialog">
          <ul class="points">${c.pts.map((p,k)=>`<li class="${teach&&k>=V.step?'hide':''} ${teach&&k===V.step-1?'now':''}">${esc(p)}</li>`).join('')}</ul>
          <div class="tnext tonly">${done?'■ 本卡重點完畢':'▼ 下一點（→ 或 空白鍵）'}</div>
        </div>
        <div class="quiz" ${done?'':'hidden'}>
          <div class="qh">❓ 想一想</div><div>${esc(c.q)}</div>
          <button class="pbtn gold" id="vAns" style="margin-top:10px">看答案</button>
          <div class="ans" id="vAnsBox">✔ ${esc(c.a)}</div>
        </div>
      </div>
    </div>
    <div class="vfoot">
      <button class="pbtn ghost" id="vPrev" ${V.i===0?'disabled':''}>◀ 上一張</button>
      <div class="mid">
        <button class="pbtn tonly" id="vBack" ${V.step<=1?'disabled':''}>▲ 上一點</button>
        <button class="pbtn tonly" id="vStep" ${done?'disabled':''}>下一點 ▼</button>
        <button class="pbtn ghost tonly" id="vAll" ${done?'disabled':''}>全部顯示</button>
        <button class="pbtn sonly collect ${coins[c.id]?'got':''}" id="vCoin">${coins[c.id]?'★ 已收集金幣':'我看懂了！收集金幣'}</button>
      </div>
      <button class="pbtn" id="vNext" ${V.i===n-1?'disabled':''}>下一張 ▶</button>
    </div></div>`;
  V.anim=0;
  const $=id=>document.getElementById(id);
  $('vClose').onclick=()=>{SFX.tap();closeViewer()};
  $('vPrev').onclick=()=>go(-1);$('vNext').onclick=()=>go(1);
  $('vAns').onclick=()=>{SFX.tap();$('vAnsBox').classList.add('show');$('vAns').hidden=true};
  $('vStep').onclick=()=>step(1);$('vBack').onclick=()=>step(-1);
  $('vAll').onclick=()=>{V.step=total;SFX.next();drawViewer()};
  $('vCoin').onclick=e=>{if(coins[c.id])return;coins[c.id]=true;store.set('coins',coins);SFX.coin();coinFx(e.currentTarget);refreshHud();drawViewer();
    if(unitCoins(V.u)===n)setTimeout(()=>{SFX.stage();toast(`★ ${U.stage} 金幣全部收集完成！`)},500)};
}
function go(d){const n=UNITS[V.u].cards.length,j=V.i+d;if(j<0||j>=n)return;V.i=j;V.step=1;V.anim=1;SFX.open();drawViewer()}
function step(d){const total=UNITS[V.u].cards[V.i].pts.length,s=V.step+d;if(s<1||s>total)return;V.step=s;SFX.next();drawViewer()}
viewer.tabIndex=-1;
viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});
document.addEventListener('keydown',e=>{
  if(document.getElementById('intro').classList.contains('show')){hideIntro();return}
  if(!viewer.classList.contains('open'))return;
  const teach=mode==='teacher',total=UNITS[V.u].cards[V.i].pts.length;
  if(e.key==='Escape'){closeViewer()}
  else if(e.key==='PageDown'){e.preventDefault();go(1)}
  else if(e.key==='PageUp'){e.preventDefault();go(-1)}
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(teach&&V.step<total)step(1);else go(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(teach&&V.step>1)step(-1);else go(-1)}

<script>
/*ANIM-START*/
/* =========================================================
   第 2 期：可操作的步驟動畫播放器
   每段動畫：播放／暫停、上一步、下一步、重播、速度（0.5×／1×／2×）
   ========================================================= */
const AP_BG='#fffdf5';
const AP={speed:1,players:new Set(),last:0};
const G=(k,x,y,inner,extra='')=>`<g data-k="${k}" data-x="${x}" data-y="${y}" ${extra}>${inner}</g>`;
const TT=(x,y,t,s=14,o={})=>T(x,y,t,Object.assign({s,b:1},o));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

function apTick(now){
  const dt=Math.min(50,now-(AP.last||now));AP.last=now;
  AP.players.forEach(P=>{
    if(!P.host.isConnected){AP.players.delete(P);return}
    if(P.paused)return;
    const d=dt*AP.speed;P.vt+=d;
    P.tw=P.tw.filter(w=>{const t=Math.min(1,(P.vt-w.t0)/w.dur);w.step(ease(t),t);if(t>=1){w.res();return false}return true});
    P.wt=P.wt.filter(w=>{if(P.vt>=w.t){w.res();return false}return true});
    if(P.def.tick)P.def.tick(P.ctx,d/1000);
  });
  requestAnimationFrame(apTick);
}
requestAnimationFrame(apTick);

function APlayer(host,def){
  const P={host,def,k:0,auto:false,paused:false,gen:0,vt:0,tw:[],wt:[],fast:false,done:false};
  const n=def.steps.length;
  host.innerHTML=`<div class="ap ${def.side?'has-side':''}">
   <div class="ap-main">
    <div class="ap-stage"><svg class="ap-svg" viewBox="0 0 480 270" shape-rendering="crispEdges" role="img" aria-label="${esc(def.title)}"></svg><div class="ap-hud"></div><div class="ap-msg" hidden></div></div>
    <div class="ap-say"><div class="ap-head"><span class="ap-no px"></span><b class="ap-st"></b></div><div class="ap-tx"></div></div>
    <div class="ap-ctl">
      <button class="pbtn ghost" data-a="prev" aria-label="上一步">⏮ 上一步</button>
      <button class="pbtn" data-a="play">▶ 播放</button>
      <button class="pbtn ghost" data-a="next" aria-label="下一步">下一步 ⏭</button>
      <button class="pbtn ghost" data-a="replay">↺ 重播</button>
      <span class="ap-spd" role="group" aria-label="速度">速度<button data-s="0.5">0.5×</button><button data-s="1">1×</button><button data-s="2">2×</button></span>
    </div>
    <div class="ap-dots">${def.steps.map((s,i)=>`<button data-i="${i}" title="${esc(s.t)}" aria-label="步驟 ${i+1}：${esc(s.t)}">${i+1}</button>`).join('')}</div>
   </div>
   ${def.side?'<aside class="ap-side pbox"></aside>':''}
  </div>`;
  const svg=host.querySelector('.ap-svg'),hud=host.querySelector('.ap-hud'),side=host.querySelector('.ap-side'),msgEl=host.querySelector('.ap-msg');
  const ST=new WeakMap();
  const ctx={P,svg,hud,side,def,state:def.state?def.state():{}};
  P.ctx=ctx;
  /* ---- 元件狀態與變形 ---- */
  function st(el){let s=ST.get(el);if(!s){s={x:+(el.dataset.x||0),y:+(el.dataset.y||0),s:+(el.dataset.s||1),r:0,o:el.dataset.o!=null?+el.dataset.o:1};ST.set(el,s)}return s}
  function apply(el){const s=st(el);el.setAttribute('transform',`translate(${s.x.toFixed(2)} ${s.y.toFixed(2)}) rotate(${s.r.toFixed(1)}) scale(${s.s.toFixed(3)})`);el.style.opacity=s.o;el.style.display=s.o<=0.001?'none':''}
  const $=k=>typeof k==='string'?svg.querySelector(`[data-k="${k}"]`):k;
  ctx.$=$;ctx.$$=sel=>[...svg.querySelectorAll(sel)];
  ctx.init=root=>{(root||svg).querySelectorAll('[data-x]').forEach(el=>{ST.delete(el);apply(el)})};
  ctx.draw=html=>{svg.innerHTML=html;ctx.init()};
  ctx.add=(html,parent)=>{const p=parent?$(parent):svg;const tmp=document.createElementNS('http://www.w3.org/2000/svg','g');tmp.innerHTML=html;const els=[...tmp.childNodes];els.forEach(e=>p.appendChild(e));els.forEach(e=>{if(e.dataset&&e.dataset.x!=null)apply(e);e.querySelectorAll&&e.querySelectorAll('[data-x]').forEach(apply)});return els[0]};
  ctx.get=k=>st($(k));
  ctx.set=(k,props)=>{const el=$(k);if(!el)return;Object.assign(st(el),props);apply(el)};
  ctx.tw=(k,props,ms=600)=>{const el=$(k);if(!el)return Promise.resolve();const s=st(el);
    if(P.fast||ms<=0){Object.assign(s,props);apply(el);return Promise.resolve()}
    const from={};for(const p in props)from[p]=s[p];
    return new Promise(res=>P.tw.push({t0:P.vt,dur:ms,res,step:e=>{for(const p in props)s[p]=from[p]+(props[p]-from[p])*e;apply(el)}}))};
  ctx.val=(obj,key,to,ms=600,upd)=>{if(P.fast||ms<=0){obj[key]=to;upd&&upd();return Promise.resolve()}const from=obj[key];
    return new Promise(res=>P.tw.push({t0:P.vt,dur:ms,res,step:e=>{obj[key]=from+(to-from)*e;upd&&upd()}}))};
  ctx.color=(k,to,ms=600,attr='fill')=>{const els=typeof k==='string'?ctx.$$(`[data-k="${k}"]`):[k];
    return Promise.all(els.map(el=>{const from=el.getAttribute(attr)||'#ffffff';if(P.fast||ms<=0){el.setAttribute(attr,to);return Promise.resolve()}
      return new Promise(res=>P.tw.push({t0:P.vt,dur:ms,res,step:(e,t)=>{el.setAttribute(attr,mixHex(from,to,t))}}))}))};
  ctx.wait=ms=>P.fast?Promise.resolve():new Promise(res=>P.wt.push({t:P.vt+ms,res}));
  ctx.all=a=>Promise.all(a);
  ctx.show=(k,ms=300)=>{ctx.set(k,{});return ctx.tw(k,{o:1},ms)};
  ctx.hide=(k,ms=300)=>ctx.tw(k,{o:0},ms);
  ctx.pulse=async(k,big=1.15,ms=260)=>{const s=ctx.get(k).s;await ctx.tw(k,{s:s*big},ms);await ctx.tw(k,{s},ms)};
  ctx.shake=async(k,amp=6)=>{const x=ctx.get(k).x;for(let i=0;i<3;i++){await ctx.tw(k,{x:x-amp},60);await ctx.tw(k,{x:x+amp},60)}await ctx.tw(k,{x},60)};
  ctx.text=(k,t)=>{const el=$(k);if(el)el.textContent=t};
  let msgT=null;
  ctx.msg=(t,kind='')=>{if(P.fast)return;msgEl.hidden=false;msgEl.className='ap-msg '+kind;msgEl.textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>msgEl.hidden=true,2600)};
  ctx.fast=()=>P.fast;
  ctx.alive=g=>g===P.gen;
  /* ---- 拖曳（手指與滑鼠） ---- */
  function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
  ctx.drag=(k,o)=>{const el=$(k);if(!el)return;el.classList.add('ap-drag');let d=null;
    el.addEventListener('pointerdown',e=>{if(o.can&&!o.can())return;e.preventDefault();if(el.nextSibling)el.parentNode.appendChild(el);try{el.setPointerCapture(e.pointerId)}catch(_){}const p=svgPt(e),s=st(el);d={dx:s.x-p.x,dy:s.y-p.y,x0:s.x,y0:s.y};o.start&&o.start(el)});
    el.addEventListener('pointermove',e=>{if(!d)return;const p=svgPt(e);ctx.set(el,{x:p.x+d.dx,y:p.y+d.dy});o.move&&o.move(st(el))});
    const up=e=>{if(!d)return;const dd=d;d=null;const s=st(el);o.drop&&o.drop(s.x,s.y,dd)};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)};
  ctx.hot=(k,fn)=>{const el=$(k);if(!el)return;el.classList.add('ap-hot');el.addEventListener('click',()=>{el.classList.remove('ap-hot');(fn||(()=>go(P.k+1,false)))()},{once:true})};
  ctx.next=()=>go(P.k+1,false);
  ctx.goto=k=>go(k,false);
  ctx.stop=()=>{P.auto=false;ui()};
  ctx.sideHTML=h=>{if(side)side.innerHTML=h};
  const stage=host.querySelector('.ap-stage');
  const fixPad=()=>{const t=hud.querySelector('.ap-tools');stage.style.paddingTop=t?(t.offsetHeight+14)+'px':'0px'};
  ctx.hudHTML=h=>{hud.innerHTML=h;fixPad()};
  new ResizeObserver(fixPad).observe(stage);
  ctx.isFree=()=>!!def.steps[P.k].free;
  ctx.teacher=()=>document.body.classList.contains('teacher');

  /* ---- 步驟控制 ---- */
  function ui(){const s=def.steps[P.k];
    host.querySelector('.ap-no').textContent=`步驟 ${P.k+1}/${n}`;
    host.querySelector('.ap-st').textContent=s.t;
    host.querySelector('.ap-tx').textContent=typeof s.say==='function'?s.say(ctx):s.say;
    host.querySelector('[data-a="prev"]').disabled=P.k===0;
    host.querySelector('[data-a="next"]').disabled=P.k===n-1;
    host.querySelector('[data-a="play"]').textContent=(P.auto&&!P.paused)?'⏸ 暫停':'▶ 播放';
    host.querySelectorAll('.ap-dots button').forEach((b,i)=>{b.classList.toggle('on',i===P.k);b.classList.toggle('past',i<P.k)});
    host.querySelectorAll('.ap-spd button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===AP.speed));
    host.querySelector('.ap').classList.toggle('free',!!s.free);
  }
  async function go(k,rebuildAlways=true){
    k=Math.max(0,Math.min(n-1,k));
    const g=++P.gen;P.tw=[];P.wt=[];P.done=false;P.paused=false;
    msgEl.hidden=true;hud.innerHTML='';stage.style.paddingTop='0px';
    def.setup(ctx,k);
    P.fast=true;
    if(!def.steps[k].fresh)for(let i=0;i<k;i++){if(def.steps[i].free)continue;await def.steps[i].run(ctx);if(g!==P.gen)return}
    P.fast=false;
    run(k,g);
  }
  async function run(k,g){
    P.k=k;P.done=false;ui();
    const s=def.steps[k];
    await s.run(ctx);
    if(g!==P.gen)return;
    P.done=true;
    if(s.free){P.auto=false;ui();return}
    if(P.auto&&k<n-1){await ctx.wait(s.hold||1400);if(g!==P.gen)return;if(P.auto&&!P.paused)run(k+1,g)}
    else if(k>=n-1){P.auto=false;ui()}
  }
  host.querySelector('[data-a="prev"]').onclick=()=>{SFX.tap();P.auto=false;go(P.k-1)};
  host.querySelector('[data-a="next"]').onclick=()=>{SFX.next();P.auto=false;go(P.k+1)};
  host.querySelector('[data-a="replay"]').onclick=()=>{SFX.tap();def.onReplay&&def.onReplay(ctx);P.auto=true;go(0)};
  host.querySelector('[data-a="play"]').onclick=()=>{SFX.tap();
    if(P.auto&&!P.paused){P.paused=true;P.auto=false;ui();return}
    P.paused=false;P.auto=true;ui();
    if(P.done&&P.k<n-1&&!def.steps[P.k].free)run(P.k+1,P.gen);
    else if(P.done&&def.steps[P.k].free&&P.k===n-1){def.onReplay&&def.onReplay(ctx);go(0)}};
  host.querySelectorAll('.ap-spd button').forEach(b=>b.onclick=()=>{AP.speed=+b.dataset.s;SFX.tap();ui()});
  host.querySelectorAll('.ap-dots button').forEach(b=>b.onclick=()=>{SFX.tap();P.auto=false;go(+b.dataset.i)});
  P.go=go;
  AP.players.add(P);
  go(0);
  return P;
}

/* ---- 單元動畫頁 ---- */
const ANIMS={};   // '2-2':[{id,name,def}] 由各單元檔填入
function renderAnimTab(u,box,which){
  const list=ANIMS[u]||[];
  const cur=list.find(a=>a.id===which)||list[0];
  box.innerHTML=`<div class="anim-pick">${list.map(a=>`<button class="lv" role="tab" aria-selected="${a===cur}" data-id="${a.id}"><small>${a.id}</small>${esc(a.name)}</button>`).join('')}</div>
    <section class="pbox anim-box"><div class="anim-host"></div></section>`;
  box.querySelectorAll('.anim-pick .lv').forEach(b=>b.onclick=()=>{SFX.tap();location.hash=`#/unit/${u}/anim/${b.dataset.id}`});
  if(cur)APlayer(box.querySelector('.anim-host'),cur.def());
}

function subShape(type){const S=SUBS[type];let o='<rect x="-108" y="-20" width="126" height="58" fill="#fff" fill-opacity="0.01"/>';
  if(type==='lipid'){o+=[-10,0,10].map(y=>`<path d="M-14 ${y} l-10 -4 l-10 4 l-10 -4 l-10 4 l-10 -4" fill="none" stroke="${C.Y}" stroke-width="4"/>`).join('')}
  else for(let i=3;i>=1;i--){const x=-i*30;o+=`<rect x="${x+10}" y="-2" width="12" height="4" fill="${C.k}"/><g transform="translate(${x} 0)">${KEY[S.key](S.col)}</g>`}
  o+=KEY[S.key](S.col);
  return o+T(-46,30,S.name,{s:14,b:1})}
function prodPiece(type,j){
  if(type==='starch')return KEY.sq(C.g).replace(/-12/g,'-9').replace(/24/g,'18');
  if(type==='protein')return `<circle r="9" fill="${C.p}" stroke="${C.k}" stroke-width="2" shape-rendering="auto"/>`;
  return j===0?`<rect x="-10" y="-8" width="20" height="16" fill="${C.y}" stroke="${C.k}" stroke-width="2"/>`:`<path d="M-14 0 l7 -4 l7 4 l7 -4 l7 4" fill="none" stroke="${C.Y}" stroke-width="4"/>`}
const SHELF={x:140,y:[60,114,168,220]};
const flashHTML=`<g data-k="fx" data-x="0" data-y="0" data-o="0">${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-3" y="-34" width="6" height="14" fill="${C.y}" stroke="${C.k}" stroke-width="1.5" transform="rotate(${a})"/>`).join('')}<rect x="-8" y="-8" width="16" height="16" fill="#fff" stroke="${C.y}" stroke-width="3" transform="rotate(45)"/></g>`;
async function flash(c,x,y){c.set('fx',{x,y,o:0,s:.5});await c.tw('fx',{o:1,s:1.3},220);await c.tw('fx',{o:0,s:1.6},220)}

/* ---------- 動畫 A：酵素分解作用 ---------- */
function defA22(){
  const ORDER=['starch','fiber','protein','lipid'];
  return {title:'動畫 A：酵素分解作用',
  state:()=>({enz:'amy',count:0,np:0,busy:false}),
  onReplay:c=>{c.state.enz='amy'},
  setup(c,k){const s=c.state;if(k<this.steps.length-1)s.enz='amy';s.count=0;s.np=0;s.busy=false;const E=ENZ[s.enz];
    c.draw(`${TT(82,24,'受質庫',15)}<rect x="6" y="32" width="164" height="232" fill="#fff4e6" stroke="${C.k}" stroke-width="2" stroke-dasharray="6 4"/>
     ${TT(434,24,'產物',15)}<rect x="390" y="32" width="86" height="232" fill="#eef8e6" stroke="${C.k}" stroke-width="2" stroke-dasharray="6 4"/>
     <text data-k="plabel" x="433" y="254" font-size="12" text-anchor="middle" font-weight="900" class="svt"></text>
     ${G('enz',280,128,enzShape(E.key,E.col))}
     ${TT(280,206,E.name,16)}
     <text data-k="cnt" x="280" y="232" font-size="15" text-anchor="middle" font-weight="900" class="svt" fill="${C.O}">本酵素已使用 0 次</text>
     <g data-k="prods"></g>
     ${ORDER.map((t,i)=>G('s_'+t,SHELF.x,SHELF.y[i],subShape(t))).join('')}
     ${flashHTML}`);
    c.hudHTML(`<div class="ap-tools">${Object.entries(ENZ).map(([k,e])=>`<button class="mini ${k===s.enz?'on':''}" data-e="${k}">${e.name}</button>`).join('')}</div>`);
    c.hud.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{SFX.tap();s.enz=b.dataset.e;c.P.go(this.steps.length-1)});
    c.text('plabel','');
  },
  site(c){const E=ENZ[c.state.enz];return {x:280+E.off,y:128}},
  async bind(c,t){const p=this.site(c);await c.tw('s_'+t,{x:p.x,y:p.y},900)},
  async breakdown(c,t){const s=c.state,E=ENZ[s.enz],p=this.site(c);
    await flash(c,p.x,p.y);c.set('s_'+t,{o:0});
    const pieces=t==='lipid'?4:4,made=[];
    for(let j=0;j<pieces;j++){const id='p'+(s.np++);const sx=p.x-(t==='lipid'?(j?12:-6):j*30),sy=p.y+(t==='lipid'&&j?(j-2)*10:0);
      c.add(G(id,sx,sy,prodPiece(t,j)),'prods');made.push(id)}
    s.count++;c.text('cnt',`本酵素已使用 ${s.count} 次`);c.text('plabel',E.prod);
    c.msg(`${SUBS[t].name}被分解成${E.prod}（大分子→小分子）`,'ok');
    await c.all(made.map((id,j)=>{const i=(s.np-pieces+j)%27;return c.tw(id,{x:408+(i%3)*24,y:52+Math.floor(i/3)*22,s:.8},700+j*120)}));
    if(s.np>=27){c.$('prods').innerHTML='';s.np=0}
    c.set('s_'+t,{x:SHELF.x,y:SHELF.y[ORDER.indexOf(t)],o:0,s:.3});await c.tw('s_'+t,{o:1,s:1},300)},
  async reject(c,t){const p=this.site(c);await c.tw('s_'+t,{x:p.x-34,y:p.y},700);await c.shake('s_'+t);
    c.msg('形狀不合：酵素具有專一性','no');SFX.lock&&!c.fast()&&SFX.lock();
    await c.tw('s_'+t,{x:SHELF.x,y:SHELF.y[ORDER.indexOf(t)]},600)},
  steps:[
   {t:'認識酵素',say:'這是澱粉酶。它的左側有特定形狀的凹槽，只有形狀吻合的受質才能和它結合。',run:async c=>{await c.wait(300);await c.pulse('enz',1.12);await c.pulse('enz',1.12)}},
   {t:'受質與酵素結合',say:'澱粉（受質）的形狀剛好吻合，和澱粉酶結合。',run:async function(c){await defA22cur.bind(c,'starch')}},
   {t:'分解作用',say:'澱粉被分解成小分子醣類——大分子轉變成小分子，就是分解作用。',run:async c=>{await defA22cur.breakdown(c,'starch')}},
   {t:'酵素可重複使用',say:'反應結束後，酵素外觀不變，仍可與新的受質作用。再來一個澱粉！',run:async c=>{await defA22cur.bind(c,'starch');await defA22cur.breakdown(c,'starch');await defA22cur.bind(c,'starch');await defA22cur.breakdown(c,'starch')}},
   {t:'專一性',say:'纖維素的形狀和澱粉酶不合，無法結合，所以澱粉酶無法分解纖維素。',run:async c=>{await defA22cur.reject(c,'fiber')}},
   {t:'換你試試',free:true,fresh:true,say:c=>`把左邊的受質拖到「${ENZ[c.state.enz].name}」上試試看！也可以按上方按鈕換成其他酵素。`,run:async function(c){
     const me=defA22cur;
     ORDER.forEach((t,i)=>c.drag('s_'+t,{can:()=>!c.state.busy,drop:async(x,y)=>{
       const p=me.site(c);c.state.busy=true;
       if(Math.hypot(x-p.x,y-p.y)<70){
         if(ENZ[c.state.enz].sub===t){await c.tw('s_'+t,{x:p.x,y:p.y},200);SFX.coin();await me.breakdown(c,t)}
         else{SFX.lock();await c.shake('s_'+t);c.msg('形狀不合：酵素具有專一性','no');await c.tw('s_'+t,{x:SHELF.x,y:SHELF.y[i]},400)}
       }else await c.tw('s_'+t,{x:SHELF.x,y:SHELF.y[i]},300);
       c.state.busy=false}}));
   }}
  ]};
}
let defA22cur=null;
function mkA22(){defA22cur=defA22();return defA22cur}

     ${G('big',240,40,`<rect x="-150" y="-16" width="300" height="32" fill="#fffbe0" stroke="${C.k}" stroke-width="2"/>`+TT(0,6,'小分子結合成為大分子＝合成作用',15),'data-o="0"')}
     ${flashHTML}`)},
  async join(c,a,b){const s=c.state;await flash(c,S1.x,E.y);c.set('bond',{o:1});
    c.msg('兩個小分子結合成較大的分子','ok');s.n++;c.text('cnt',`已合成 ${s.n} 個大分子`);await c.show('big',300)},
  async release(c,a,b){const s=c.state,i=(s.n-1)%6,tx=432,ty=60+i*36;
    const dx=tx-S1.x;await c.all([c.tw(a,{x:S1.x+dx,y:ty-12,s:.8},800),c.tw(b,{x:S1.x+dx,y:ty+12,s:.8},800),c.tw('bond',{x:S1.x+dx,y:ty,o:0},800)])},
  steps:[
   {t:'認識合成作用',say:'左邊是兩個小分子（例如葡萄糖）。合成作用要把小分子結合成大分子。',run:async c=>{await c.pulse('m1');await c.pulse('m2')}},
   {t:'第一個小分子結合',say:'第一個小分子進入酵素的凹槽。',run:async c=>{await c.tw('m1',{x:S1.x,y:S1.y},800)}},
   {t:'第二個小分子結合',say:'第二個小分子也進入凹槽，兩者靠在一起。',run:async c=>{await c.tw('m2',{x:S2.x,y:S2.y},800)}},
   {t:'結合成大分子',say:'在酵素的作用下，兩個小分子結合成為大分子——這就是合成作用。',run:async c=>{await me.join(c,'m1','m2')},hold:2000},
   {t:'酵素再次釋出',say:'大分子離開後，酵素外觀不變，可以再次作用。',run:async c=>{await me.release(c,'m1','m2');await c.pulse('enz',1.1)}},
   {t:'換你試試',free:true,say:'把左邊的兩個小分子拖進酵素的凹槽，看它們結合成大分子！',run:async c=>{
     const s=c.state;c.$('lay').innerHTML='';
     const spawn=(slot)=>{const id='g'+(s.id++);c.add(G(id,76,slot?190:100,glu),'lay');c.set(id,{s:.3});c.tw(id,{s:1},250);
       c.drag(id,{can:()=>!s.busy,drop:async(x,y)=>{
         if(Math.hypot(x-S1.x,y-E.y)<70&&s.fill.length<2){const tgt=s.fill.length?S2:S1;s.fill.push(id);await c.tw(id,{x:tgt.x,y:tgt.y},200);SFX.tap();
           spawn(slot);
           if(s.fill.length===2){s.busy=true;const [a,b]=s.fill;c.set('bond',{x:S1.x,y:E.y,o:0});await me.join(c,a,b);SFX.coin();await c.wait(500);await me.release(c,a,b);c.hide('big');s.fill=[];s.busy=false}}
         else await c.tw(id,{x:76,y:slot?190:100},300)}})};
     ['m1','m2'].forEach(k=>c.set(k,{o:0}));c.set('big',{o:0});spawn(0);spawn(1)}}
  ]};return me;
}

/* ---------- 動畫 C：活性實驗室 ---------- */
const ENZ_LAB={
  stomach:{name:'胃中的酵素',opt:2,col:'#d9a400',sub:'protein'},
  saliva:{name:'唾液中的酵素',opt:7,col:'#2e9e44',sub:'starch'},
  intestine:{name:'小腸中的酵素',opt:8.3,col:'#2b8be0',sub:'starch'}
};
function defC22(){
  const BK={x:30,y:40,w:250,h:200};
  const me={title:'動畫 C：活性實驗室',side:true,
  state:()=>({T:37,pH:7,enz:'saliva',dead:false,phDead:false,parts:[],enzs:[],act:0,result:''}),
  far(s){return Math.abs(s.pH-ENZ_LAB[s.enz].opt)},
  act(s){return s.phDead?0:this.tAct(s)*this.pAct(s)},
  fresh(c){const s=c.state;s.dead=false;s.phDead=false;s.result='';
    s.parts=Array.from({length:12},(_,i)=>({x:BK.x+30+Math.random()*(BK.w-60),y:BK.y+40+Math.random()*(BK.h-70),vx:Math.random()*2-1,vy:Math.random()*2-1,p:0}));
    s.enzs=Array.from({length:3},()=>({x:BK.x+40+Math.random()*(BK.w-80),y:BK.y+50+Math.random()*(BK.h-90),vx:Math.random()*2-1,vy:Math.random()*2-1}));
    this.drawParts(c)},
  tAct(s){if(s.dead)return 0;const T=s.T;if(T<=37)return 0.08+0.92*Math.pow(Math.max(0,T)/37,1.6);return Math.max(0,1-Math.pow((T-37)/24,2))},

      const col=sub==='starch'?C.g:C.p;
      return `<g data-i="${i}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})">${done?piece(-9,col)+piece(9,col):piece(-12,col)+piece(0,col)+piece(12,col)+`<rect x="-8" y="-1" width="16" height="2" fill="${C.k}"/>`}</g>`}).join('')+
      s.enzs.map(e=>{const f=this.far(s);const tf=s.dead?'rotate(28) skewX(25) scale(.3 .26)':s.phDead?'rotate(-22) skewY(-28) scale(.36 .2)':f>1.6?`rotate(${-(f-1.6)*9}) scale(.3 ${(.3-(f-1.6)*.03).toFixed(3)})`:'scale(.3)';
      const col=s.dead?'#b9a0a8':s.phDead?'#c9b48a':f>1.6?'#f2a0ae':'#ff8fa3';return `<g transform="translate(${e.x.toFixed(1)} ${e.y.toFixed(1)}) ${tf}">${enzShape(s.enz==='stomach'?'cir':'sq',col)}</g>`}).join('')},
  updUI(c){const s=c.state;const a=this.act(s);s.act=a;
    const th=c.$('thermo');if(th){const h=Math.max(2,Math.min(100,s.T))*1.4;th.setAttribute('y',224-h);th.setAttribute('height',h)}
    c.text('tval',`${Math.round(s.T)}℃`);c.text('pval',`pH ${s.pH.toFixed(1)}`);
    const tm=c.$('tmark');if(tm)tm.setAttribute('transform',`translate(${312+Math.min(100,s.T)*1.5} 0)`);
    const pm=c.$('pmark');if(pm)pm.setAttribute('transform',`translate(${312+(s.pH-1)/9*150} 0)`);
    const rb=c.$('rate');if(rb)rb.setAttribute('width',Math.round(a*130));
    const side=c.side;if(side){const ts=side.querySelector('#labT'),ps=side.querySelector('#labP');if(ts&&document.activeElement!==ts)ts.value=s.T;if(ps&&document.activeElement!==ps)ps.value=s.pH;

      const st=side.querySelector('#labState');if(st)st.innerHTML=s.dead?'<b style="color:#d6336c">✖ 溫度過高：酵素已永久失去活性</b>':s.phDead?'<b style="color:#d6336c">✖ 酸鹼值超過能忍受的範圍：酵素構造改變，失去活性</b><br><small>按「重新裝一批」換新的酵素</small>':this.far(s)>1.6?'<b style="color:#b8561a">▼ 酸鹼值不適合：酵素開始變形，活性降低</b>':(a<.2?'<b style="color:#b8561a">▼ 活性很低</b>':(a>.75?'<b style="color:#2f9e44">▲ 活性很好</b>':'<b>● 活性普通</b>'));
      side.querySelectorAll('[data-lab]').forEach(b=>b.classList.toggle('on',b.dataset.lab===s.enz));
      side.querySelectorAll('input,button').forEach(i=>{if(!i.dataset.always)i.disabled=!c.isFree()})}},
  tick(c,dt){const s=c.state;if(!s.parts.length)return;const sp=0.25+Math.max(0,Math.min(100,s.T))/45;

      ${chart(8,'溫度（0～100℃）')}<path d="M314 96 C340 94 360 80 372 46 C378 28 384 26 390 34 C396 46 400 80 404 98" fill="none" stroke="${C.r}" stroke-width="3" shape-rendering="auto"/>

      ${chart(140,'酸鹼值：酸性 ← 中性 → 鹼性')}
      <g shape-rendering="auto" fill="none" stroke-width="3">${Object.values(ENZ_LAB).map(e=>{const x=312+(e.opt-1)/9*150;return `<path d="M${x-26} 228 C${x-12} 228 ${x-8} 160 ${x} 160 C${x+8} 160 ${x+12} 228 ${x+26} 228" stroke="${e.col}"/>`}).join('')}</g>
      <g data-k="pmark"><line x1="0" y1="142" x2="0" y2="230" stroke="${C.k}" stroke-width="2" stroke-dasharray="3 3"/><polygon points="0,230 -6,238 6,238" fill="${C.k}"/></g>
      <text data-k="pval" x="388" y="140" font-size="12" text-anchor="middle" font-weight="900" class="svt">pH 7</text>`);

  steps:[
   {t:'正常狀態',say:'37℃、中性環境中，唾液中的酵素活性很好，澱粉很快被分解成小分子。',run:async c=>{await c.wait(3500)}},
   {t:'溫度降低',say:'溫度降到 10℃：分子運動變慢，酵素活性降低，但酵素沒有被破壞。',run:async c=>{me.fresh(c);await c.val(c.state,'T',10,1500,()=>me.updUI(c));await c.wait(2500)}},
   {t:'回到 37℃',say:'溫度回到 37℃，酵素活性恢復，反應又變快了。',run:async c=>{await c.val(c.state,'T',37,1500,()=>me.updUI(c));await c.wait(2500)}},
   {t:'溫度過高',say:'溫度升到 80℃：溫度過高會破壞酵素構造（變形），酵素失去活性。',run:async c=>{me.fresh(c);await c.val(c.state,'T',80,1800,()=>me.updUI(c));c.state.dead=true;me.drawParts(c);me.updUI(c);await c.wait(2200)}},

   {t:'酸鹼值的影響',say:'換一批新的唾液中的酵素，把環境調成酸性（pH 2，像胃裡）：超過唾液中的酵素能忍受的範圍，酵素構造改變（變形），失去活性。',run:async c=>{c.state.T=37;me.fresh(c);await c.val(c.state,'pH',2,2000,()=>me.updUI(c));c.state.phDead=true;me.drawParts(c);me.updUI(c);await c.wait(2500)}},
   {t:'胃中的酵素',say:'改成胃中的酵素：它在酸性環境中活性較佳。小腸中的酵素則適合在鹼性環境中作用。每種酵素都有自己能忍受的酸鹼範圍。',run:async c=>{c.state.T=37;c.state.pH=2;c.state.enz='stomach';me.fresh(c);me.updUI(c);await c.wait(3500)}},

  ]};return me;
}

const CP={x:222,y:122,rx:150,ry:84};
function rnd(i){const x=Math.sin(i*12.9898+4.1)*43758.5453;return x-Math.floor(x)}
function defB23(){
  const R={C:5.2,O:5.6,H:3.6},COL={C:'#3a3a3a',O:'#e83f3f',H:'#ffffff'};

  const atoms=[];let id=0;

    [['O',-10],['C',0],['O',10]].forEach(([t,dx])=>atoms.push({k:'a'+id++,t,mol:'co2',m,src:{x:sx+dx,y:sy},in:{x:ix+dx,y:iy}}))}
  for(let m=0;m<12;m++){const col=m%3,row=Math.floor(m/3),sx=22+col*24,sy=146+row*22,ix=110+col*30,iy=88+row*28;
    [['O',0,0],['H',-7,6],['H',7,6]].forEach(([t,dx,dy])=>atoms.push({k:'a'+id++,t,mol:'h2o',m,src:{x:sx+dx,y:sy+dy},in:{x:ix+dx,y:iy+dy}}))}
  atoms.forEach((a,i)=>{const ang=rnd(i)*Math.PI*2,rr=Math.sqrt(rnd(i+99));a.sc={x:CP.x+Math.cos(ang)*rr*(CP.rx-24),y:CP.y+Math.sin(ang)*rr*(CP.ry-20)}});
  // 目標：葡萄糖（C6H12O6）、6 O2（氧來自水）、6 H2O
  // 目標：1 個葡萄糖分子 C6H12O6（球棍模型，原子由鍵連在一起）、6 個 O2（氧來自水）、6 個 H2O
  const GX=200,GY=106,RR=17,dir=(deg,d)=>({x:Math.cos(deg*Math.PI/180)*d,y:Math.sin(deg*Math.PI/180)*d}),add=(p,q)=>({x:p.x+q.x,y:p.y+q.y});
  const ring=[-30,30,90,150,210,270].map(a=>add({x:GX,y:GY},dir(a,RR)));      // ring[0]=環上的 O，ring[1..5]=C1..C5
  const C6=add(ring[5],dir(240,15));
  const ohO=[1,2,3,4].map(i=>add(ring[i],dir([30,90,150,210][i-1]+20,15))).concat([add(C6,dir(190,14))]);
  const ohH=ohO.map((o,i)=>add(o,dir(i<4?[30,90,150,210][i]+20:190,9)));
  const chH=[1,2,3,4,5].map(i=>add(ring[i],dir(i<5?[30,90,150,210][i-1]-35:310,11)));
  const c6H=[add(C6,dir(270,10)),add(C6,dir(325,10))];
  const tgt={C:[ring[1],ring[2],ring[3],ring[4],ring[5],C6],Og:[ring[0],...ohO],Hg:[...ohH,...chH,...c6H],O2:[],Ow:[],Hw:[]};
  const L=(a,b)=>`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="#2a1a12" stroke-width="2.6" shape-rendering="auto"/>`;
  let bondG=`<circle cx="${GX-3}" cy="${GY-6}" r="47" fill="#fff8d0" fill-opacity=".75" stroke="#d9a400" stroke-width="2.5" stroke-dasharray="6 4" shape-rendering="auto"/>`;
  for(let i=0;i<6;i++)bondG+=L(ring[i],ring[(i+1)%6]);
  bondG+=L(ring[5],C6);[1,2,3,4].forEach((r,i)=>bondG+=L(ring[r],ohO[i]));bondG+=L(C6,ohO[4]);ohO.forEach((o,i)=>bondG+=L(o,ohH[i]));
  [1,2,3,4,5].forEach((r,i)=>bondG+=L(ring[r],chH[i]));c6H.forEach(h=>bondG+=L(C6,h));
  let bondO='',bondW='';
  for(let i=0;i<6;i++){const x=300+(i%3)*30,y=72+Math.floor(i/3)*26;tgt.O2.push({x:x-7,y},{x:x+7,y});bondO+=L({x:x-7,y},{x:x+7,y})}
  for(let i=0;i<6;i++){const x=160+i*25,y=190;tgt.Ow.push({x,y});tgt.Hw.push({x:x-8,y:y+7},{x:x+8,y:y+7});bondW+=L({x,y},{x:x-8,y:y+7})+L({x,y},{x:x+8,y:y+7})}
  let co2O=atoms.filter(a=>a.mol==='co2'&&a.t==='O'),h2oO=atoms.filter(a=>a.mol==='h2o'&&a.t==='O'),Cs=atoms.filter(a=>a.t==='C'),Hs=atoms.filter(a=>a.t==='H');
  Cs.forEach((a,i)=>a.to=tgt.C[i]);h2oO.forEach((a,i)=>{a.to=tgt.O2[i];a.prod='o2'});co2O.forEach((a,i)=>{if(i<6)a.to=tgt.Og[i];else{a.to=tgt.Ow[i-6];a.prod='w'}});

        [[-110,-30],[-70,20],[-20,-40],[30,30],[80,-20],[110,30],[-120,30]].map(([x,y])=>[0,1,2,3].map(j=>`<rect data-k="gr" x="${x-14}" y="${y-12+j*6}" width="28" height="6" fill="${j%2?C.G:C.g}"/>`).join('')).join('')+TT(0,-CP.ry+18,'葉綠體',15))}
      <text data-k="cap" x="${CP.x}" y="224" font-size="13" text-anchor="middle" font-weight="900" class="svt"></text>

      <g data-k="bg" data-x="0" data-y="0" data-o="0">${bondG}</g><g data-k="bo" data-x="0" data-y="0" data-o="0">${bondO}</g><g data-k="bw" data-x="0" data-y="0" data-o="0">${bondW}</g>
      ${atoms.map(a=>G(a.k,a.src.x,a.src.y,`<circle r="${R[a.t]}" fill="${COL[a.t]}" stroke="${C.k}" stroke-width="1.6" shape-rendering="auto"/>`)).join('')}
      ${G('lglu',197,0,TT(0,164,'1 個葡萄糖分子 C₆H₁₂O₆',13)+TT(0,178,'（6 個碳、12 個氫、6 個氧）',11),'data-o="0"')}${G('lo2',324,58,TT(0,0,'氧氣',14),'data-o="0"')}${G('lw',318,196,TT(0,0,'水',14),'data-o="0"')}
      <g data-k="fate" data-x="0" data-y="0" data-o="0">${TAG(420,124,'細胞直接利用',C.y,{s:12})}${TAG(420,154,'轉換成澱粉儲存',C.c,{s:12})}${TAG(420,184,'形成纖維素',C.l,{s:12})}${AR(240,118,366,124,C.O)}${AR(240,122,360,154,C.O)}${AR(240,126,366,182,C.O)}</g>
      ${G('stoma',440,70,TT(0,-14,'經氣孔釋放',12)+`<rect x="-14" y="-6" width="28" height="10" fill="${C.g}" stroke="${C.k}" stroke-width="2"/>`,'data-o="0"')}

    c.hudHTML('');},
  eq(c,k,col){const g=c.$(k);if(g)g.querySelector('rect').setAttribute('fill',col)},
  async light(c){const g=c.$('photons');g.innerHTML='';for(let i=0;i<5;i++)c.add(G('ph'+i,40,34,`<rect x="-5" y="-5" width="10" height="10" fill="${C.y}" stroke="${C.k}" stroke-width="1.5"/>`),'photons');
    await c.all([0,1,2,3,4].map(i=>c.wait(i*120).then(()=>c.tw('ph'+i,{x:120+i*40,y:80+(i%2)*40,o:0},800))));

  async waterIn(c){await c.all(atoms.filter(a=>a.mol==='h2o').map((a,i)=>c.wait((a.m)*60).then(()=>c.tw(a.k,{x:a.in.x,y:a.in.y},800))));this.eq(c,'eq1',C.c)},
  async co2In(c){await c.all(atoms.filter(a=>a.mol==='co2').map(a=>c.wait(a.m*80).then(()=>c.tw(a.k,{x:a.in.x,y:a.in.y},800))));this.eq(c,'eq2',C.e)},

       if(miss.length){if(manual){SFX.lock();c.msg(`缺少${miss.join('、')}：無法進行光合作用`,'no')}return}run()};
     const inCP=(x,y)=>Math.pow((x-CP.x)/CP.rx,2)+Math.pow((y-CP.y)/CP.ry,2)<1;
     [['tSun','sun',()=>{c.set('sun',{o:1});return me.light(c)}],['tW','w',()=>{atoms.filter(a=>a.mol==='h2o').forEach(a=>c.set(a.k,{o:1}));return me.waterIn(c)}],['tC','c',()=>{atoms.filter(a=>a.mol==='co2').forEach(a=>c.set(a.k,{o:1}));return me.co2In(c)}]].forEach(([k,key,fn])=>{const home=c.get(k);const hx=home.x,hy=home.y;
       c.drag(k,{can:()=>!s.busy,drop:async(x,y)=>{if(inCP(x,y)){c.set(k,{o:0});s.load[key]=1;showLoad();await fn();tryGo(false)}else c.tw(k,{x:hx,y:hy},300)}})});
     c.hud.querySelector('#goPS').onclick=()=>tryGo(true);showLoad()}}
  ]};return me;
}

    mol:{carb:'single',prot:'single',fat:'single'},chunk:'tiny',ans:{carb:1,prot:1,fat:1},

];
const MP=(x,y)=>({x:-114+2.1*x,y:4+2.1*y});
const ZX=196,ZW=280,ZC=ZX+ZW/2;
function defSim24(){
  const me={title:'消化之旅模擬器',

  nuts(s){return s.nut==='mix'?['carb','prot','fat']:[s.nut]},
  molAt(n,i){let m='long';for(let j=1;j<=i&&j<STATIONS.length;j++){const st=STATIONS[j];if(st.mol&&st.mol[n])m=st.mol[n]}return m},
  chunkAt(i){let ch='big';for(let j=1;j<=i;j++){if(STATIONS[j].chunk)ch=STATIONS[j].chunk}return ch},
  rows(s){const ns=this.nuts(s);return ns.length===1?[{n:ns[0],y:186,sc:1}]:ns.map((n,i)=>({n,y:150+i*40,sc:.72}))},
  setup(c,k){const s=c.state;s.asked={};

      <g data-k="juice"></g>
      <g data-k="ztag"></g>
      ${flashHTML}`);
    // 地圖縮放
    c.$('map').setAttribute('transform','translate(-114 4) scale(2.1)');
    c.hudHTML(`<div class="ap-tools">${[['carb','醣類（吐司）'],['prot','蛋白質（蛋）'],['fat','脂質（奶油）'],['mix','三種一起']].map(([k,n])=>`<button class="mini ${s.nut===k?'on':''}" data-n="${k}">${n}</button>`).join('')}

  },
  map(c,i){const st=STATIONS[i];c.$('map').innerHTML=torso(st.hl,[]);c.text('zt',`放大視窗：${st.name}`);c.$('zbg').setAttribute('fill',st.bg||'#fff')},
  async moveBall(c,i){for(const [x,y] of STATIONS[i].path){const p=MP(x,y);await c.tw('ball',{x:p.x,y:p.y},500)}},
  tag(c,list){c.$('ztag').innerHTML=list.map((t,i)=>{const col={mol:C.r,vol:C.b,push:C.E,abs:C.G,water:'#3a8fb7',out:C.n}[t[0]];const w=[...t[1]].length*12+14;
    return `<rect x="${ZX+ZW-8-w}" y="${42+i*24}" width="${w}" height="20" fill="${col}" stroke="${C.k}" stroke-width="2"/><text x="${ZX+ZW-8-w/2}" y="${57+i*24}" font-size="12" text-anchor="middle" fill="#fff" font-weight="900">${t[1]}</text>`}).join('')},
  drawRows(c,i){const s=c.state,rows=this.rows(s);

    rows.forEach(r=>{const m=this.molAt(r.n,i);h+=G('mol_'+r.n,ZC+6,r.y,MOL[r.n][m](),`data-s="${r.sc}"`)+`<text data-k="ml_${r.n}" x="${ZC+6}" y="${r.y+(r.sc<1?17:24)}" font-size="${r.sc<1?10:12}" text-anchor="middle" font-weight="900" class="svt">${MOLNAME[r.n][m]}</text>`});
    c.$('zone').innerHTML='';c.add(`<g>${h}</g>`,'zone')},
  chunkHTML(s,ch,emul){if(s.nut==='fat'){return emul?CHUNK.drops():`<ellipse rx="${{big:40,small:30,tiny:22}[ch]}" ry="${{big:24,small:18,tiny:14}[ch]}" fill="${C.y}" stroke="${C.k}" stroke-width="3" shape-rendering="auto"/>`}return CHUNK[ch](CHUNKCOL[s.nut==='mix'?'mix':s.nut])},
  async juice(c,list){const g=c.$('juice');g.innerHTML='';
    for(const [i,[n,col]] of list.entries()){const x=ZX+40+i*88;c.add(G('jd'+i,x,40,spr(SP.drop,-7,-9,2.4).replace(/#5aa9e6/g,col).replace(/#a7e6ff/g,'#fff')+`<rect x="-4" y="14" width="0" height="0"/>`)+`<text data-k="jl${i}" x="${x}" y="${list.length>1?70+i*12:70}" font-size="11" text-anchor="${list.length>1?'start':'middle'}" font-weight="900" class="svt" opacity="0">${n}</text>`,'juice');
      await c.tw('jd'+i,{y:62},450);const l=c.$('jl'+i);l.setAttribute('opacity','1');l.setAttribute('text-anchor','start');l.setAttribute('x',ZX+12);l.setAttribute('y',54+i*15);c.set('jd'+i,{o:0})}},
  async cut(c,n,to){const k='mol_'+n,el=c.$(k);if(!el)return;const p=c.get(k);
    c.add(G('sc_'+n,p.x-90,p.y-22,`<path d="M0 0 l10 10 M10 0 l-10 10" stroke="${C.k}" stroke-width="3"/><circle cx="-2" cy="-2" r="3" fill="none" stroke="${C.k}" stroke-width="2"/>`),'zone');
    await c.tw('sc_'+n,{x:p.x+90},700);c.set('sc_'+n,{o:0});await flash(c,p.x,p.y);
    el.innerHTML=MOL[n][to]();c.text('ml_'+n,MOLNAME[n][to])},
  async ask(c,i){const s=c.state,st=STATIONS[i];if(!s.mission||c.fast()||!st.ans||s.asked[i])return;
    const yes=this.nuts(s).some(n=>st.ans[n]);
    await new Promise(res=>{c.hudHTML(c.hud.innerHTML+`<div class="ap-q"><b>任務：在「${st.name}」，分子有沒有改變？</b><div><button class="pbtn" data-a="1">有改變</button><button class="pbtn ghost" data-a="0">沒有改變</button></div><p class="ap-qr"></p></div>`);
      this.rebind(c);
      c.hud.querySelectorAll('.ap-q [data-a]').forEach(b=>b.onclick=()=>{const ok=(b.dataset.a==='1')===yes;
        if(ok){SFX.coin();s.asked[i]=1;c.hud.querySelector('.ap-q').remove();res()}
        else{SFX.lock();c.hud.querySelector('.ap-qr').textContent='✖ 再想想！'+(yes?'這裡有酵素把大分子分解成較小的分子。':'這裡只有體積變小或位置移動，分子沒有被分解。')}})})},
  rebind(c){const s=c.state;c.hud.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{SFX.tap();s.nut=b.dataset.n;c.P.go(0)});
    const m=c.hud.querySelector('[data-m]');if(m)m.onclick=()=>{SFX.tap();s.mission=!s.mission;c.P.go(Math.max(0,Math.min(c.P.k,STATIONS.length-2)))}},
  async station(c,i){const s=c.state,st=STATIONS[i],ns=this.nuts(s);
    this.map(c,i);this.drawRows(c,i-1);c.$('ztag').innerHTML='';c.$('juice').innerHTML='';
    await this.moveBall(c,i);
    await this.ask(c,i);
    if(st.juice)await this.juice(c,st.juice);
    if(st.push){await this.peristalsis(c);this.tag(c,[['push','只推送（位置移動）']]);return}
    // 體積
    const ch=c.$('chunk');
    if(st.key==='si'&&ns.includes('fat')){if(s.nut==='fat'){await flash(c,ZC,96);ch.innerHTML=CHUNK.drops();c.msg('膽汁乳化脂質：只有體積改變，分子沒變','ok');await c.wait(900)}}
    else if(st.chunk&&st.chunk!==this.chunkAt(i-1)){await c.pulse('chunk',1.15,200);ch.innerHTML=this.chunkHTML(s,st.chunk);await c.pulse('chunk',1.1,200)}
    // 分子
    const tags=[];
    for(const n of ns){const before=this.molAt(n,i-1),after=this.molAt(n,i);
      if(before!==after){await this.cut(c,n,after);tags.push(n)}}
    const tl=[];
    if(ns.length===1){tl.push(tags.length?['mol','分子改變']:['vol','只有體積改變']);if(tags.length&&st.chunk)tl.push(['vol','體積也變小'])}
    else{ns.forEach(n=>tl.push(tags.includes(n)?['mol',`${NUT[n].name}：分子改變`]:['vol',`${NUT[n].name}：體積改變`]))}
    this.tag(c,tl)},
  async peristalsis(c){c.$('zone').innerHTML='';
    c.add(`<g>${TT(ZX+70,60,'食道',13)}<rect x="${ZC-30}" y="44" width="60" height="214" fill="${C.p}" stroke="${C.k}" stroke-width="3"/>
      ${G('bolus',ZC,70,CHUNK.small(CHUNKCOL[c.state.nut==='mix'?'mix':c.state.nut]),'data-s=".55"')}
      ${G('sqz',ZC,40,`<rect x="-44" y="-8" width="16" height="16" fill="${C.P}" stroke="${C.k}" stroke-width="2"/><rect x="28" y="-8" width="16" height="16" fill="${C.P}" stroke="${C.k}" stroke-width="2"/>${AR(-60,0,-46,0,C.r,3)}${AR(60,0,46,0,C.r,3)}`)}
      ${TT(ZC+90,160,'管壁肌肉收縮',12)}${TT(ZC+90,176,'（蠕動）',12)}${TT(ZC-92,160,'不分泌',12)}${TT(ZC-92,176,'消化液',12)}</g>`,'zone');
    await c.all([c.tw('bolus',{y:236},1800),c.wait(150).then(()=>c.tw('sqz',{y:200},1800))])},
  async absorb(c,i){const s=c.state,ns=this.nuts(s),t=c.teacher();this.map(c,i);c.$('ztag').innerHTML='';c.$('juice').innerHTML='';await this.moveBall(c,i);
    let h=`${[0,1,2,3].map(j=>{const x=ZX+40+j*66;return `<path d="M${x-22} 262 V170 C${x-22} 140 ${x+22} 140 ${x+22} 170 V262" fill="${C.p}" stroke="${C.k}" stroke-width="3" shape-rendering="auto"/><path d="M${x-12} 262 V172 C${x-12} 158 ${x+12} 158 ${x+12} 172 V262" fill="none" stroke="${C.r}" stroke-width="3" shape-rendering="auto"/>`+(t?`<rect x="${x-2}" y="166" width="4" height="96" fill="${C.y}"/>`:'')}).join('')}
      ${TAG(ZX+50,134,'絨毛',C.w,{s:11})}${TAG(ZX+ZW-50,134,'微血管',C.r,{s:11,tf:'#fff'})}${t?TAG(ZC,250,'補充（教師）：甘油、脂肪酸主要進入乳糜管',C.y,{s:10}):''}`;

    if(ns.includes('carb')){await c.all([0,1,2].map(j=>c.tw('fib'+j,{x:ZX+ZW+20,o:0},1100)));c.msg('纖維素無法被吸收，繼續前往大腸')}
    this.tag(c,[['abs','吸收：小分子進入血液']])},

      ${[0,1,2,3,4].map(j=>G('wd'+j,ZC-50+j*25,112+(j%2)*60,spr(SP.drop,-7,-9,2))).join('')}
      ${TT(ZC,240,'大腸較小腸粗短',12)}</g>`,'zone');
    await c.wait(300);

    const names={mouth:'口腔',eso:'咽、食道',stom:'胃',si:'小腸',li:'大腸'};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stars(acc){return acc>=.9?3:acc>=.7?2:acc>=.5?1:0}

function linkBtn(link){if(!link)return '';const [k,u,x]=link.split(':');

/* ---- 單題呈現：render(q, host, done(correct)) ---- */
function renderQ(q,host,done){
  const lv=q.level==='會考'&&q.year?`會考｜${q.year}`:q.level;
  let body='',ready=()=>true,check=null,reveal=null;
  host.innerHTML=`<div class="q-card"><div class="q-tags"><span class="q-tag t-${q.type}">${TYPE_NAME[q.type]}</span><span class="q-tag lv-${q.level}">${esc(lv)}</span></div>
    <div class="q-stem">${q.type==='fill'?esc(q.stem).replace(/\{(\d)\}/g,(m,i)=>`<select data-b="${i}" aria-label="第 ${+i+1} 格"><option value="">（選擇）</option>${q.options[+i].map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select>`):esc(q.stem)}</div>
    <div class="q-body"></div><div class="q-act"></div><div class="q-fb" hidden></div></div>`;
  const B=host.querySelector('.q-body'),A=host.querySelector('.q-act'),FB=host.querySelector('.q-fb');
  let answered=false;
  const finish=(ok,ansText)=>{if(answered)return;answered=true;ok?SFX.coin():SFX.lock();
    host.querySelectorAll('button.q-opt,select,.m-chip,.m-slot').forEach(e=>{e.disabled=true;e.classList.add('lock')});
    A.innerHTML='';FB.hidden=false;FB.className='q-fb '+(ok?'ok':'no');
    FB.innerHTML=`<div class="q-res">${ok?'✔ 答對了！':'✖ 答錯了'}</div>${ok?'':`<div class="q-ans"><b>正確答案：</b>${ansText}</div>`}<div class="q-exp">${esc(q.explain)}</div><div class="q-links">${linkBtn(q.link)}</div><div class="q-next"></div>`;
    bindLinks(FB);done&&done(ok,FB.querySelector('.q-next'))};
  if(q.type==='single'||q.type==='tf'){
    B.innerHTML=`<div class="q-opts ${q.type}">${q.options.map((o,i)=>`<button class="q-opt" data-i="${i}"><span class="q-l">${q.type==='tf'?(i?'✕':'○'):'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`;
    B.querySelectorAll('.q-opt').forEach(b=>b.onclick=()=>{if(answered)return;const i=+b.dataset.i,ok=i===q.answer;
      b.classList.add(ok?'right':'wrong');B.querySelector(`[data-i="${q.answer}"]`).classList.add('right');
      finish(ok,`${q.type==='tf'?'':'ABCD'[q.answer]+'. '}${esc(q.options[q.answer])}`)});
  }else if(q.type==='fill'){
    A.innerHTML=`<button class="pbtn" data-go>確定答案</button>`;
    A.querySelector('[data-go]').onclick=()=>{const sel=[...host.querySelectorAll('select[data-b]')];
      if(sel.some(s=>s.value==='')){toast('還有空格沒有選喔！');return}
      let ok=true;sel.forEach(s=>{const b=+s.dataset.b,r=+s.value===q.answer[b];s.classList.add(r?'right':'wrong');if(!r)ok=false});
      finish(ok,esc(q.stem).replace(/\{(\d)\}/g,(m,i)=>`<u>${esc(q.options[+i][q.answer[+i]])}</u>`))};
  }else if(q.type==='match'){
    const L=q.options.left,R=q.options.right,order=shuffle(R.map((_,i)=>i)),put={};let pick=null;
    B.innerHTML=`<p class="q-tip">把右邊的說明拖到左邊對應的格子（也可以先點說明、再點格子）。</p><div class="m-wrap"><div class="m-left">${L.map((l,i)=>`<div class="m-row"><span class="m-key">${esc(l)}</span><button class="m-slot" data-s="${i}">放這裡</button></div>`).join('')}</div>
      <div class="m-right">${order.map(j=>`<button class="m-chip" data-c="${j}">${esc(R[j])}</button>`).join('')}</div></div>`;
    const draw=()=>{B.querySelectorAll('.m-slot').forEach(s=>{const j=put[s.dataset.s];s.textContent=j==null?'放這裡':R[j];s.classList.toggle('full',j!=null)});
      B.querySelectorAll('.m-chip').forEach(c=>{c.classList.toggle('used',Object.values(put).includes(+c.dataset.c));c.classList.toggle('pick',pick===+c.dataset.c)})};
    const place=(slot,j)=>{for(const k in put)if(put[k]===j)delete put[k];put[slot]=j;pick=null;SFX.tap();draw()};
    B.querySelectorAll('.m-chip').forEach(c=>{c.onclick=()=>{if(answered)return;pick=+c.dataset.c;draw()};
      c.addEventListener('pointerdown',e=>{if(answered)return;const j=+c.dataset.c;const g=c.cloneNode(true);g.classList.add('m-ghost');document.body.appendChild(g);
        const mv=ev=>{g.style.left=ev.clientX-40+'px';g.style.top=ev.clientY-20+'px'};mv(e);let moved=false;
        const m2=ev=>{moved=true;mv(ev)};
        const up=ev=>{document.removeEventListener('pointermove',m2);document.removeEventListener('pointerup',up);g.remove();
          if(!moved)return;const el=document.elementFromPoint(ev.clientX,ev.clientY);const s=el&&el.closest('.m-slot');if(s&&B.contains(s))place(s.dataset.s,j)};
        document.addEventListener('pointermove',m2);document.addEventListener('pointerup',up)})});
    B.querySelectorAll('.m-slot').forEach(s=>s.onclick=()=>{if(answered)return;if(pick!=null)place(s.dataset.s,pick);else if(put[s.dataset.s]!=null){delete put[s.dataset.s];draw()}});
    A.innerHTML=`<button class="pbtn" data-go>確定答案</button>`;
    A.querySelector('[data-go]').onclick=()=>{if(Object.keys(put).length<L.length){toast('還有格子沒有放喔！');return}
      let ok=true;B.querySelectorAll('.m-slot').forEach(s=>{const r=put[s.dataset.s]===q.answer[+s.dataset.s];s.classList.add(r?'right':'wrong');if(!r)ok=false});
      finish(ok,L.map((l,i)=>`${esc(l)} → ${esc(R[q.answer[i]])}`).join('；'))};
  }else if(q.type==='hotspot'){
    const H=HOT[q.options.figure],regs=H.regions();
    B.innerHTML=`<p class="q-tip">直接在圖上點一下。</p><svg class="hs" viewBox="${H.vb}" shape-rendering="crispEdges">${H.svg()}<g class="hs-mark"></g></svg>`;
    const svg=B.querySelector('svg'),mark=B.querySelector('.hs-mark');
    const hl=(n,col)=>regs[n].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 2"/>`).join('');
    svg.addEventListener('click',e=>{if(answered)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
      const hit=H.order.find(n=>regs[n].some(([x,y,w,h])=>p.x>=x-1.5&&p.x<=x+w+1.5&&p.y>=y-1.5&&p.y<=y+h+1.5));
      if(!hit){toast('請點在圖中的構造上');return}
      const ok=hit===q.answer;mark.innerHTML=(ok?'':hl(hit,'#d6336c'))+hl(q.answer,'#2f9e44')+`<circle cx="${p.x}" cy="${p.y}" r="2.2" fill="#2a1a12"/>`;
      finish(ok,`${esc(q.answer)}（綠框處）${ok?'':`；你點的是「${esc(hit)}」`}`)});
  }
}

const PR={};
function renderPractice(u,box){
  const st=QS.get(),best=(st.best||{})[u],wrongAll=WRONG.get(),wrongU=wrongAll.filter(id=>id.startsWith('q'+u.replace('-',''))),n=QB.filter(q=>q.unit===u).length;
  box.innerHTML=`<section class="pbox pr-home">
    <div class="pr-stat"><div><b class="px">本單元最佳</b><div class="stars">${starHTML(best?best.stars:0)}</div><div>${best?`正確率 ${Math.round(best.acc*100)}%`:'還沒有紀錄'}</div></div>
      <div><b class="px">累計作答</b><div class="big px">${st.answered||0}</div><div>答對 ${st.correct||0} 題</div></div>
      <div><b class="px">錯題本</b><div class="big px">${wrongAll.length}</div><div>本單元 ${wrongU.length} 題</div></div></div>
    <div class="pr-modes">
      <button class="pbox pr-mode" data-m="unit"><span class="px">單元練習</span><small>${esc(UNITS[u].name)}：隨機 10 題（題庫 ${n} 題）</small></button>
      <button class="pbox pr-mode" data-m="mix"><span class="px">綜合挑戰</span><small>2-2、2-3、2-4 混合 20 題</small></button>
      <button class="pbox pr-mode" data-m="wrong" ${wrongAll.length?'':'disabled'}><span class="px">錯題重練</span><small>${wrongAll.length?`重練錯題本中的 ${Math.min(10,wrongAll.length)} 題，答對就移出`:'目前沒有錯題'}</small></button>
    </div></section><div class="pr-play"></div>`;
  box.querySelectorAll('.pr-mode').forEach(b=>b.onclick=()=>{SFX.open();startPractice(u,b.dataset.m,box)});
}
function startPractice(u,mode,box){
  let list;
  if(mode==='unit')list=shuffle(QB.filter(q=>q.unit===u)).slice(0,10);
  else if(mode==='mix'){const per=[7,7,6];list=shuffle(ORDER.flatMap((x,i)=>shuffle(QB.filter(q=>q.unit===x)).slice(0,per[i])))}
  else{const w=WRONG.get();list=shuffle(QB.filter(q=>w.includes(q.id))).slice(0,10)}
  if(!list.length){toast('沒有題目可以練習');return}
  const S={u,mode,list,i:0,ok:0,wrong:[]};
  box.innerHTML=`<section class="pbox pr-run"><div class="pr-bar"><span class="px pr-no"></span><div class="pr-prog"><i></i></div><span class="px pr-coin">${spriteSvg('coin',2,'style="width:16px;height:16px;vertical-align:-2px"')} × <b>0</b></span><button class="pbtn ghost pr-quit">結束</button></div><div class="pr-q"></div></section>`;
  box.querySelector('.pr-quit').onclick=()=>{SFX.tap();renderPractice(u,box)};
  const show=()=>{const q=S.list[S.i];box.querySelector('.pr-no').textContent=`第 ${S.i+1}／${S.list.length} 題`;box.querySelector('.pr-prog i').style.width=(S.i/S.list.length*100)+'%';
    renderQ(q,box.querySelector('.pr-q'),(ok,next)=>{
      const st=QS.get();st.answered=(st.answered||0)+1;if(ok)st.correct=(st.correct||0)+1;QS.set(st);
      let w=WRONG.get();if(ok){if(S.mode==='wrong')w=w.filter(x=>x!==q.id)}else{if(!w.includes(q.id))w.push(q.id);S.wrong.push(q)}WRONG.set(w);
      if(ok){S.ok++;box.querySelector('.pr-coin b').textContent=S.ok}
      next.innerHTML=`<button class="pbtn">${S.i<S.list.length-1?'下一題 ▶':'看結果 ▶'}</button>`;
      next.querySelector('button').onclick=()=>{SFX.next();S.i++;if(S.i<S.list.length){show();box.scrollIntoView({block:'start'})}else result()};
    })};
  const result=()=>{const acc=S.ok/S.list.length,s=stars(acc);
    if(S.mode==='unit'){const st=QS.get();st.best=st.best||{};const b=st.best[u];if(!b||acc>b.acc)st.best[u]={acc,stars:s};QS.set(st)}
    if(S.mode==='mix'){const st=QS.get();if(!st.mix||acc>st.mix.acc)st.mix={acc,stars:s};QS.set(st)}
    if(s>=2)SFX.stage();
    box.innerHTML=`<section class="pbox pr-result"><div class="px pr-clear">${s===3?'PERFECT!':s?'STAGE CLEAR!':'再接再厲！'}</div><div class="stars big">${starHTML(s)}</div>
      <p>答對 <b>${S.ok}</b> ／ ${S.list.length} 題，正確率 <b>${Math.round(acc*100)}%</b></p>
      ${S.wrong.length?`<div class="pr-wl"><b>這次答錯的題目（已收進錯題本）：</b><ol>${S.wrong.map(q=>`<li>${esc(q.stem.replace(/\{\d\}/g,'＿＿'))}</li>`).join('')}</ol></div>`:''}
      <div class="pr-btns"><button class="pbtn" data-a="again">再玩一次</button>${WRONG.get().length?'<button class="pbtn gold" data-a="wrong">錯題重練</button>':''}<button class="pbtn ghost" data-a="home">回練習首頁</button></div></section>`;
    box.querySelector('[data-a="again"]').onclick=()=>startPractice(u,S.mode,box);
    const wb=box.querySelector('[data-a="wrong"]');if(wb)wb.onclick=()=>startPractice(u,'wrong',box);
    box.querySelector('[data-a="home"]').onclick=()=>renderPractice(u,box);
    box.scrollIntoView({block:'start'})};
  show();
}

      br.kids.forEach((k,ki)=>E.push([`${u}:b${bi}`,`${u}:b${bi}:k${ki}`]));y+=GAP*1.6});

}

function lineIdx(card,marks){return BL.map((l,i)=>l.every(j=>marks&&marks[card[j]])?i:-1).filter(i=>i>=0)}
const BG_UNITS=[['2-2','2-2 酵素'],['2-3','2-3 植物如何製造養分'],['2-4','2-4 人體如何獲得養分']];
function scopeUnits(scope){return !scope||scope==='all'?BG_UNITS.map(u=>u[0]):String(scope).split('+')}
function scopeName(scope){const u=scopeUnits(scope);return u.length===3?'全章（2-2、2-3、2-4）':u.join('＋')}
function bPool(scope,level){const us=scopeUnits(scope);let p=QB.filter(q=>q.bingo&&us.includes(q.unit));const f=level==='all'?p:p.filter(q=>q.level===level);p=f.length>=25?f:p;
  // 各單元輪流排列，讓 25 格的題目平均分配到勾選的單元
  const g=us.map(u=>shuffle(p.filter(q=>q.unit===u))),out=[];for(let i=0;g.some(a=>a.length);i++){const a=g[i%g.length];if(a.length)out.push(a.shift())}return out}
function bQ(q,big){return `<div class="bq ${big?'big':''}"><div class="q-tags"><span class="q-tag">${TYPE_NAME[q.type]}</span><span class="q-tag lv-${q.level}">${esc(q.level==='會考'&&q.year?'會考｜'+q.year:q.level)}</span><span class="q-tag">${q.unit}</span></div><div class="bq-stem">${esc(q.stem)}</div></div>`}

function joinURL(code,demo){return `${location.protocol.startsWith('http')?location.origin+location.pathname:SITE_URL}#/bingo/join/${code}${demo?'/demo':''}`}

async function startGame(){

function nextTurn(pidForce){

  else if(st.order==='random'){const recent=(H.room.turn&&H.room.turn.pid)||'';const c=ps.filter(x=>x.id!==recent);p=(c.length?c:ps)[Math.floor(Math.random()*(c.length||ps.length))]}
  else{const cur=H.room.turn&&H.room.turn.pid;const all=sortedPlayers();let i=all.findIndex(x=>x.id===cur);for(let k=1;k<=all.length;k++){const c=all[(i+k+all.length)%all.length];if(c.online!==false){p=c;break}}p=p||all[0]}
  DB.update(H.R,{turn:{seq:(H.room.turn?.seq||0)+1,state:'wait',pid:p.id,name:p.name,cls:p.cls}});
}
async function drawBall(){
  const t=H.room.turn;if(!t||t.state!=='wait')return;
  const left=[];for(let n=1;n<=25;n++)if(!(H.room.opened||{})[n])left.push(n);

  BAU.spin();
  BG.next=setTimeout(()=>{const T=(H.room.info.timer||30)*1000;DB.update(H.R,{'turn/state':'question','turn/qid':H.room.qmap[n],'turn/deadline':DB.now()+T})},1800);
}
async function judge(choice){
  const t=H.room.turn;if(!t||t.state!=='question'||H.judging===t.seq)return;H.judging=t.seq;
  const q=qById(t.qid),ok=choice!=null&&choice===q.answer;
  const up={'turn/state':'result','turn/choice':choice==null?-1:choice,'turn/ok':ok};
  if(ok)up['opened/'+t.n]=DB.ts();
  else{const sp=(H.room.spare||[]).slice(),u=q.unit,i=sp.findIndex(id=>(qById(id)||{}).unit===u);const j=i>=0?i:0;if(sp.length){up['qmap/'+t.n]=sp[j];sp.splice(j,1);sp.push(t.qid);up.spare=sp}}
  await DB.update(H.R,up);
  DB.push(H.R+'/log',{pid:t.pid,name:t.name,cls:t.cls||'',n:t.n,qid:t.qid,ok,ts:DB.ts()});
  ok?BAU.ok():BAU.bad();
  BG.next=setTimeout(()=>nextTurn(),ok?5000:5500);
}
